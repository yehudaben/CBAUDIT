/* ============================================================
   DESIGN SYSTEM — live theme editing.
   Every control writes a CSS custom property on <html>, so the
   whole UI restyles without re-rendering the report.
   "Copy theme CSS" emits a replacement for the THEME block.
   ============================================================ */
const THEME_DEFAULTS = {
  crit:"#d03b3b", serious:"#ec835a", warn:"#fab219", good:"#0ca30c", accent:"#2a78d6",
  page:"#f9f9f7", surface:"#fcfcfb", ink:"#0b0b0b",
  font:'system-ui,-apple-system,"Segoe UI",sans-serif',
  fs:15, d:1, r:10, bw:1, rail:4, maxw:1240, shadow:"none", zebra:"transparent"
};
const THEME = Object.assign({}, THEME_DEFAULTS);

const FONT_CHOICES = [
  ['system-ui,-apple-system,"Segoe UI",sans-serif', "System UI (default)"],
  ['"Inter","Helvetica Neue",Helvetica,Arial,sans-serif', "Inter / Helvetica"],
  ['"Segoe UI","Roboto",sans-serif', "Segoe / Roboto"],
  ['Georgia,"Times New Roman",serif', "Georgia serif"],
  ['ui-monospace,"SF Mono","Cascadia Mono",Consolas,monospace', "Monospace"]
];
const SURFACE_PRESETS = [
  ["paper",  "Paper (default)", "#f9f9f7", "#fcfcfb", "#0b0b0b"],
  ["white",  "Pure white",      "#ffffff", "#ffffff", "#111111"],
  ["warm",   "Warm grey",       "#f6f4f0", "#fffdfa", "#1a1714"],
  ["cool",   "Cool grey",       "#f4f6f8", "#fbfcfd", "#0f1417"],
  ["contrast","High contrast",  "#ffffff", "#ffffff", "#000000"]
];
const SHADOW_CHOICES = [
  ["none","Flat (default)"],
  ["0 1px 2px rgba(0,0,0,.05)","Subtle"],
  ["0 2px 6px rgba(0,0,0,.08)","Raised"],
  ["0 4px 14px rgba(0,0,0,.10)","Floating"]
];

/* --- contrast maths, so a colour choice can be checked not guessed --- */
function hexToRgb(h){
  h=String(h).replace("#","");
  if(h.length===3) h=h.split("").map(c=>c+c).join("");
  const v=parseInt(h,16);
  return [(v>>16)&255,(v>>8)&255,v&255];
}
function lum(h){
  const s=hexToRgb(h).map(c=>{c/=255;return c<=0.03928?c/12.92:Math.pow((c+0.055)/1.055,2.4);});
  return 0.2126*s[0]+0.7152*s[1]+0.0722*s[2];
}
function contrast(a,b){
  const l1=lum(a), l2=lum(b);
  return (Math.max(l1,l2)+0.05)/(Math.min(l1,l2)+0.05);
}
function activeSurface(){
  const dark = document.documentElement.getAttribute("data-theme")==="dark"
    || (!document.documentElement.getAttribute("data-theme")
        && window.matchMedia("(prefers-color-scheme: dark)").matches);
  return dark ? "#1a1a19" : THEME.surface;
}

function applyTheme(){
  const r=document.documentElement.style;
  r.setProperty("--crit",THEME.crit);
  r.setProperty("--serious",THEME.serious);
  r.setProperty("--warn",THEME.warn);
  r.setProperty("--good",THEME.good);
  r.setProperty("--accent",THEME.accent);
  r.setProperty("--font",THEME.font);
  r.setProperty("--fs",THEME.fs+"px");
  r.setProperty("--d",String(THEME.d));
  r.setProperty("--r",THEME.r+"px");
  r.setProperty("--bw",THEME.bw+"px");
  r.setProperty("--rail",THEME.rail+"px");
  r.setProperty("--maxw",THEME.maxw+"px");
  r.setProperty("--shadow",THEME.shadow);
  r.setProperty("--zebra",THEME.zebra);
  // surfaces only override light mode; dark keeps its validated steps
  const isDark = document.documentElement.getAttribute("data-theme")==="dark"
    || (!document.documentElement.getAttribute("data-theme")
        && window.matchMedia("(prefers-color-scheme: dark)").matches);
  if(isDark){
    r.removeProperty("--page"); r.removeProperty("--surface"); r.removeProperty("--ink");
  } else {
    r.setProperty("--page",THEME.page);
    r.setProperty("--surface",THEME.surface);
    r.setProperty("--ink",THEME.ink);
  }
  refreshContrast();
}

function refreshContrast(){
  document.querySelectorAll("[data-cx]").forEach(el=>{
    const key=el.getAttribute("data-cx");
    const c=contrast(THEME[key], activeSurface());
    el.textContent = c.toFixed(2)+":1";
    el.className = "cx " + (c>=3 ? "ok" : "no");
    el.title = c>=3 ? "Passes 3:1 against the current surface"
      : "Below 3:1 against the current surface — pair it with a label or icon, never colour alone";
  });
}

function designPanelHTML(openState){
  const col = (k,label,note) => `<div class="prow"><b>${label}</b>
    <span class="swatchrow"><input type="color" data-t="${k}" value="${THEME[k]}">
    <span class="cx" data-cx="${k}"></span></span>
    ${note?`<span>${note}</span>`:""}</div>`;
  return `<details class="panel" id="designPanel"${openState?" open":""}><summary>Colour, type, density, shape</summary>
    <div class="pgrid">
      ${col("crit","Critical / act today")}
      ${col("serious","High tier")}
      ${col("warn","Monitor tier")}
      ${col("good","Positive / confirm")}
      ${col("accent","Accent — chart bars, focus")}
      <div class="prow"><b>Typeface</b>
        <select data-t="font">${FONT_CHOICES.map(([v,l])=>
          `<option value='${v}'${THEME.font===v?" selected":""}>${l}</option>`).join("")}</select></div>
      <div class="prow"><b>Base text size — <span class="v" id="vFs">${THEME.fs}px</span></b>
        <input type="range" min="12" max="19" step="0.5" data-t="fs" value="${THEME.fs}">
        <span>Everything scales from this.</span></div>
      <div class="prow"><b>Density — <span class="v" id="vD">${THEME.d}</span></b>
        <input type="range" min="0.6" max="1.25" step="0.02" data-t="d" value="${THEME.d}">
        <span>Padding and gaps. Lower fits more on screen.</span></div>
      <div class="prow"><b>Corner radius — <span class="v" id="vR">${THEME.r}px</span></b>
        <input type="range" min="0" max="20" step="1" data-t="r" value="${THEME.r}"></div>
      <div class="prow"><b>Border weight — <span class="v" id="vBw">${THEME.bw}px</span></b>
        <input type="range" min="0" max="3" step="1" data-t="bw" value="${THEME.bw}"></div>
      <div class="prow"><b>Card rail — <span class="v" id="vRail">${THEME.rail}px</span></b>
        <input type="range" min="0" max="10" step="1" data-t="rail" value="${THEME.rail}">
        <span>Coloured stripe down the left of cards.</span></div>
      <div class="prow"><b>Content width — <span class="v" id="vMaxw">${THEME.maxw}px</span></b>
        <input type="range" min="900" max="1800" step="20" data-t="maxw" value="${THEME.maxw}"></div>
      <div class="prow"><b>Surface preset</b>
        <select data-t="__surface">${SURFACE_PRESETS.map(p=>
          `<option value="${p[0]}"${THEME.page===p[2]&&THEME.surface===p[3]?" selected":""}>${p[1]}</option>`).join("")}</select>
        <span>Light mode only — dark keeps its validated steps.</span></div>
      <div class="prow"><b>Shadow</b>
        <select data-t="shadow">${SHADOW_CHOICES.map(([v,l])=>
          `<option value="${v}"${THEME.shadow===v?" selected":""}>${l}</option>`).join("")}</select></div>
      <div class="prow"><b>Table stripes</b>
        <select data-t="zebra">
          <option value="transparent"${THEME.zebra==="transparent"?" selected":""}>Off (default)</option>
          <option value="var(--wash)"${THEME.zebra==="var(--wash)"?" selected":""}>On</option>
        </select></div>
    </div>
    <div class="pfoot">
      <button class="btn sm" id="btnThemeCopy">Copy theme CSS</button>
      <button class="btn sm" id="btnThemeReset">Reset to defaults</button>
      <button class="btn sm" id="btnDensityToggle">Toggle compact</button>
    </div>
    <div class="pnote">Changes are live and affect only how this page looks — never the numbers.
      The contrast figure beside each colour is measured against the current surface; below 3:1 the
      colour must be paired with a text label or icon rather than carrying meaning on its own, which
      is why every tier badge here shows a word as well as a dot. Use <em>Copy theme CSS</em> to paste
      your values permanently into the THEME block at the top of the file.</div>
  </details>`;
}

function themeCSS(){
  return `:root{
  /* colours */
  --crit:${THEME.crit}; --serious:${THEME.serious}; --warn:${THEME.warn};
  --good:${THEME.good}; --accent:${THEME.accent};
  /* light surfaces + ink */
  --page:${THEME.page}; --surface:${THEME.surface}; --ink:${THEME.ink};
  /* type */
  --font:${THEME.font}; --fs:${THEME.fs}px;
  /* shape + density */
  --d:${THEME.d}; --r:${THEME.r}px; --bw:${THEME.bw}px; --rail:${THEME.rail}px;
  --maxw:${THEME.maxw}px; --shadow:${THEME.shadow}; --zebra:${THEME.zebra};
}`;
}

function wireDesign(){
  const p=document.getElementById("designPanel"); if(!p) return;
  p.querySelectorAll("[data-t]").forEach(inp=>{
    const key=inp.getAttribute("data-t");
    const ev = inp.type==="range" ? "input" : "change";
    inp.addEventListener(ev, ()=>{
      if(key==="__surface"){
        const pr=SURFACE_PRESETS.find(x=>x[0]===inp.value);
        if(pr){ THEME.page=pr[2]; THEME.surface=pr[3]; THEME.ink=pr[4]; }
      } else if(["fs","d","r","bw","rail","maxw"].indexOf(key)>=0){
        THEME[key]=parseFloat(inp.value);
        const lbl={fs:"vFs",d:"vD",r:"vR",bw:"vBw",rail:"vRail",maxw:"vMaxw"}[key];
        const el=document.getElementById(lbl);
        if(el) el.textContent = key==="d" ? THEME.d.toFixed(2) : THEME[key]+(key==="maxw"||key==="fs"||key==="r"||key==="bw"||key==="rail"?"px":"");
      } else {
        THEME[key]=inp.value;
      }
      applyTheme();
    });
  });
  document.getElementById("btnThemeCopy").onclick=async()=>{
    const css=themeCSS();
    try{ await navigator.clipboard.writeText(css); toast("Theme CSS copied — paste over the THEME block."); }
    catch(e){
      const ta=document.createElement("textarea"); ta.value=css;
      ta.style.position="fixed"; ta.style.opacity="0"; document.body.appendChild(ta);
      ta.select(); document.execCommand("copy"); ta.remove();
      toast("Theme CSS copied.");
    }
  };
  document.getElementById("btnThemeReset").onclick=()=>{
    Object.assign(THEME, THEME_DEFAULTS); applyTheme();
    const dp=document.getElementById("designPanel"); const open=dp.open;
    dp.outerHTML=designPanelHTML(); document.getElementById("designPanel").open=open;
    wireDesign();
    toast("Theme reset to defaults.");
  };
  document.getElementById("btnDensityToggle").onclick=()=>{
    THEME.d = THEME.d>0.85 ? 0.72 : 1; applyTheme();
    const s=document.querySelector('[data-t="d"]'); if(s) s.value=THEME.d;
    const el=document.getElementById("vD"); if(el) el.textContent=THEME.d.toFixed(2);
    toast(THEME.d<0.85 ? "Compact density." : "Comfortable density.");
  };
}


/* ---------- CSV parsing (RFC4180-ish, handles quotes + embedded commas) ---------- */
function parseCSV(text){
  text = text.replace(/^﻿/,"");
  const rows=[]; let row=[], field="", inQ=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(inQ){
      if(c==='"'){ if(text[i+1]==='"'){field+='"';i++;} else inQ=false; }
      else field+=c;
    } else {
      if(c==='"') inQ=true;
      else if(c===","){ row.push(field); field=""; }
      else if(c==="\n"){ row.push(field); rows.push(row); row=[]; field=""; }
      else if(c==="\r"){ /* skip */ }
      else field+=c;
    }
  }
  if(field.length||row.length){ row.push(field); rows.push(row); }
  return rows.filter(r => r.some(x => String(x).trim()!==""));
}
const num = s => {
  const c = String(s==null?"":s).replace(/[$,%\s]/g,"").replace(/,/g,"");
  if(c===""||c==="-") return 0;
  const v = parseFloat(c);
  return isNaN(v) ? 0 : v;
};

/* map header names -> canonical keys, so column order can move without breaking */
const COLMAP = {
  "bckt":"b", "bucket":"b",
  "merch.":"m", "merch":"m", "merchant":"m",
  "dba":"d",
  "mid":"id",
  "# sales":"s", "#sales":"s", "sales":"s",
  "$ sales":"ds", "$sales":"ds",
  "avg sales":"avg",
  "$ rfnds":"dr", "$rfnds":"dr", "$ refunds":"dr",
  "% rfnds":"prf", "% refunds":"prf",
  "cb #":"cb", "cb#":"cb",
  "cb vol.":"cv", "cb vol":"cv", "cb volume":"cv",
  "% cb":"pcb",
  "# rdr":"rn", "#rdr":"rn",
  "$ rdr":"rd", "$rdr":"rd",
  "amex":"ax", "visa":"vi", "mc":"mc", "disc":"dc", "discover":"dc"
};
const REQUIRED = ["b","m","d","id","s","ds","dr","cb","cv","rn","ax","vi","mc","dc"];

function loadSnapshot(text, name){
  const raw = parseCSV(text);
  if(!raw.length) throw new Error("That file appears to be empty.");
  const head = raw[0].map(h => String(h).trim().toLowerCase());
  const idx = {};
  head.forEach((h,i)=>{ const k=COLMAP[h]; if(k && idx[k]===undefined) idx[k]=i; });
  /* Our own audit export shares many column names with a portal export,
     so without this guard a saved audit read back from the folder would
     parse as a phantom report containing only the flagged rows. */
  const AUDIT_SIGNATURE = ["tier","flags","primary","action"];
  if(AUDIT_SIGNATURE.every(h => head.indexOf(h)>=0)){
    const err = new Error("That file is an audit produced by this tool, not a portal export.");
    err.isAudit = true;
    throw err;
  }
  const missing = REQUIRED.filter(k => idx[k]===undefined);
  if(missing.length){
    throw new Error("This does not look like a portal chargeback export — could not find column(s): "
      + missing.join(", ") + ". Found header: " + raw[0].filter(x=>x).join(", "));
  }
  const rows=[];
  for(let i=1;i<raw.length;i++){
    const r=raw[i];
    const mid = String(r[idx.id]==null?"":r[idx.id]).trim();
    if(!mid) continue;
    rows.push({
      b:String(r[idx.b]||"").trim(), m:String(r[idx.m]||"").trim(), d:String(r[idx.d]||"").trim(),
      id:mid,
      s:Math.round(num(r[idx.s])), ds:num(r[idx.ds]), dr:num(r[idx.dr]),
      cb:Math.round(num(r[idx.cb])), cv:num(r[idx.cv]),
      rn:Math.round(num(r[idx.rn])),
      ax:Math.round(num(r[idx.ax])), vi:Math.round(num(r[idx.vi])),
      mc:Math.round(num(r[idx.mc])), dc:Math.round(num(r[idx.dc])),
      pcbSrc:String(r[idx.pcb]==null?"":r[idx.pcb]).trim(),
      prfSrc:String(r[idx.prf]==null?"":r[idx.prf]).trim()
    });
  }
  if(!rows.length) throw new Error("No data rows found under the header.");
  // date from filename when present: CB______YYYYMMDDHH.MM.SS
  let stamp=null;
  const mm = /(\d{4})(\d{2})(\d{2})(\d{2})[.\-_](\d{2})[.\-_](\d{2})/.exec(name||"");
  if(mm){
    stamp = `${mm[1]}-${mm[2]}-${mm[3]} ${mm[4]}:${mm[5]}:${mm[6]}`;
  } else {
    /* a hand-named file like 2026-08-14.csv still sorts correctly; the
       time of day is filled in from the file itself by the scanner */
    const dd = /(20\d{2})-(\d{2})-(\d{2})/.exec(name||"");
    if(dd) stamp = `${dd[1]}-${dd[2]}-${dd[3]} 00:00:00`;
  }
  return {name:name||"report.csv", rows, stamp, dateOnly:!mm && !!stamp};
}

/* ---------- scoring ---------- */
function score(r){
  const M=MODEL;
  const cbp = r.s>0 ? r.cb/r.s*100 : null;
  const rfp = r.ds>0 ? r.dr/r.ds*100 : null;
  const cov = (r.rn+r.vi)>0 ? r.rn/(r.rn+r.vi)*100 : null;
  const mcs = r.cb>0 ? r.mc/r.cb*100 : null;
  const zs  = (r.s===0 && r.cb>0);
  /* month-to-date sales too small for a rate to mean much yet. Does NOT
     change flags or weight — it only marks the row so nobody chases a
     merchant that merely looks bad because it is the 3rd of the month. */
  const thin = (r.s>0 && r.s < M.thinSales);
  const bad = (cbp!==null && cbp>100);
  const F=[];
  if(r.vi>=M.f1Visa && (r.rn===0 || (cov!==null && cov<M.f1Cov))) F.push("F1");
  if(r.rn===0 && r.vi>M.f2Visa) F.push("F2");
  if(r.mc>M.f3Mc && rfp!==null && rfp<M.f3Rfnd) F.push("F3");
  if(r.ax>=M.f4Brand || r.dc>=M.f4Brand) F.push("F4");
  if(cbp!==null && cbp>M.f5Cbp && r.cb>=M.f5Cb) F.push("F5");
  let base=0; F.forEach(f=>base+=M.w[f]);
  let bon=0;
  if(F.indexOf("F5")>=0 && !bad){
    bon = cbp>M.bonHi ? M.bonHiPts : (cbp>=M.bonMid ? M.bonMidPts : 0);
  }
  const w = bad ? base : base+bon;
  let pri=""; for(const s of SEVERITY){ if(F.indexOf(s)>=0){pri=s;break;} }
  return Object.assign({}, r, {cbp,rfp,cov,mcs,zs,thin,bad,F,nf:F.length,bon,w,pri});
}
function tierOf(e){
  if(e.bad) return "QUARANTINE";
  if(e.zs)  return "INTEGRITY";
  if(e.nf===0) return "NONE";
  return e.w>=MODEL.tierCrit ? "CRITICAL" : (e.w>=MODEL.tierHigh ? "HIGH" : "MONITOR");
}
function analyse(snap){
  const E = snap.rows.map(score);
  const ranked = E.filter(e=>e.nf>0 && !e.bad && !e.zs)
                  .sort((a,b)=> b.w-a.w || b.cb-a.cb);
  const crit  = ranked.filter(e=>e.w>=MODEL.tierCrit);
  const high  = ranked.filter(e=>e.w>=MODEL.tierHigh && e.w<MODEL.tierCrit);
  const mon   = ranked.filter(e=>e.w<MODEL.tierHigh);
  const quar  = E.filter(e=>e.bad);
  const integ = E.filter(e=>e.zs).sort((a,b)=>b.cb-a.cb);
  const active= E.filter(e=>e.s>0||e.cb>0).length;
  const flagCounts={};
  ["F1","F2","F3","F4","F5"].forEach(f=>flagCounts[f]=E.filter(e=>e.F.indexOf(f)>=0).length);
  const nfTiers={};
  [1,2,3,4,5].forEach(k=>nfTiers[k]=E.filter(e=>e.nf>=k).length);
  // buckets
  const bm={};
  E.forEach(e=>{
    const x = bm[e.b] || (bm[e.b]={name:e.b,n:0,fl:0,zs:0,s:0,ds:0,dr:0,cb:0,rn:0,ax:0,vi:0,mc:0,dc:0});
    x.n++; if(e.nf>0)x.fl++; if(e.zs)x.zs++;
    x.s+=e.s; x.ds+=e.ds; x.dr+=e.dr; x.cb+=e.cb; x.rn+=e.rn;
    x.ax+=e.ax; x.vi+=e.vi; x.mc+=e.mc; x.dc+=e.dc;
  });
  const buckets = Object.values(bm).filter(b=>b.cb>0).sort((a,b)=>b.cb-a.cb);
  // merchants with multiple flagged MIDs
  const mg={};
  E.forEach(e=>{ if(e.nf>0){ (mg[e.m]||(mg[e.m]=[])).push(e); } });
  const multi = Object.keys(mg).map(k=>({m:k,rows:mg[k]}))
                  .filter(x=>x.rows.length>=2)
                  .sort((a,b)=>b.rows.length-a.rows.length);
  return {E,ranked,crit,high,mon,quar,integ,active,flagCounts,nfTiers,buckets,multi,
          total:E.length, inert:E.length-active,
          withCB:E.filter(e=>e.cb>0).length,
          byMid:(function(){const o={};E.forEach(e=>o[e.id]=e);return o;})()};
}

/* ---------- verification: our % vs the portal's own % columns ---------- */
function verify(A){
  let checked=0, mismatch=[];
  A.E.forEach(e=>{
    if(e.pcbSrc && /\d/.test(e.pcbSrc) && e.cbp!==null){
      const p=num(e.pcbSrc); checked++;
      if(Math.abs(p-e.cbp)>0.006) mismatch.push(`${e.d} CB% ${e.cbp.toFixed(2)} vs portal ${e.pcbSrc}`);
    }
    if(e.prfSrc && /\d/.test(e.prfSrc) && e.rfp!==null){
      const p=num(e.prfSrc); checked++;
      if(Math.abs(p-e.rfp)>0.006) mismatch.push(`${e.d} Rfnd% ${e.rfp.toFixed(2)} vs portal ${e.prfSrc}`);
    }
  });
  return {checked, mismatch};
}

/* ---------- action text ---------- */
function actionFor(e){
  const F=e.F, bits=[];
  if(F.indexOf("F5")>=0) bits.push(e.cbp>5 ? "immediate review — reserve or volume cap" : "immediate review");
  if(F.indexOf("F2")>=0) bits.push("enable RDR today (currently off)");
  else if(F.indexOf("F1")>=0) bits.push("raise the RDR ceiling");
  if(F.indexOf("F3")>=0) bits.push("Ethoca alerts + refund-policy and descriptor check");
  if(F.indexOf("F4")>=0) bits.push("merchant-side remediation for Amex/Discover");
  if(!bits.length) bits.push("monitor");
  const s=bits.join("; ");
  return s.charAt(0).toUpperCase()+s.slice(1)+".";
}
function triggerFor(e){
  switch(e.pri){
    case "F5": return `CB ${e.cbp.toFixed(2)}% on ${e.cb} CBs`;
    case "F1": return `Visa ${e.vi} CBs at ${fmtP(e.cov)} RDR coverage`;
    case "F3": return `MC ${e.mc} CBs on ${fmtP(e.rfp)} refunds`;
    case "F4": {
      const p=[]; if(e.ax>=MODEL.f4Brand)p.push("Amex "+e.ax);
      if(e.dc>=MODEL.f4Brand)p.push("Disc "+e.dc); return p.join(" / ")+" CBs";
    }
    default:  return `Visa ${e.vi} CBs with RDR 0`;
  }
}


/* ============================================================
   BUCKET MULTI-SELECT — one selection shared by Audit and Trends,
   so "I only care about these portfolios" holds wherever you look.
   VIEW.buckets is null for "all", otherwise a Set of bucket names.
   ============================================================ */
function bucketStats(){
  /* counts come from the report on screen, so the list shows what is
     actually in front of you rather than a stale roster */
  const A = window.__A;
  const out = new Map();
  if(A) A.E.forEach(e=>{
    const x = out.get(e.b) || {name:e.b, n:0, flagged:0, cb:0, over:0};
    x.n++; x.cb += e.cb;
    if(e.nf>0) x.flagged++;
    if(e.F.indexOf("F5")>=0) x.over++;
    out.set(e.b, x);
  });
  return [...out.values()].sort((a,b)=>a.name.localeCompare(b.name));
}
function bucketsSelected(){ return VIEW.buckets; }        // null = all
function bucketAllowed(name){
  return !VIEW.buckets || VIEW.buckets.has(name);
}
function setBuckets(set){
  const stats = bucketStats();
  if(!set || set.size===0 || set.size===stats.length) VIEW.buckets = null;
  else VIEW.buckets = set;
}
function bucketLabel(){
  const stats = bucketStats();
  if(!VIEW.buckets) return {text:"All buckets", count:stats.length, active:false};
  if(VIEW.buckets.size===1) return {text:[...VIEW.buckets][0], count:1, active:true};
  return {text:VIEW.buckets.size+" buckets selected", count:VIEW.buckets.size, active:true};
}
function bucketPickerHTML(){
  const stats = bucketStats();
  const lab = bucketLabel();
  const q = (VIEW.bkQ||"").trim().toLowerCase();
  const shown = q ? stats.filter(s=>s.name.toLowerCase().indexOf(q)>=0) : stats;
  return `<div class="msel" id="bkMsel">
    <button class="mselbtn${lab.active?" active":""}" id="bkBtn"
        aria-expanded="${VIEW.bkOpen?"true":"false"}">
      <span class="lbl">${esc(lab.text)}</span>
      <span class="cnt">${lab.count}</span><span class="car">▾</span></button>
    <div class="mselpanel${VIEW.bkOpen?" open":""}" id="bkPanel">
      <input type="search" id="bkQ" placeholder="Search buckets…" value="${esc(VIEW.bkQ||"")}">
      <div class="mselacts">
        <button data-bk-act="all">Select all</button>
        <button data-bk-act="none">Clear</button>
        <button data-bk-act="cb">With chargebacks</button>
        <button data-bk-act="flagged">With flagged MIDs</button>
        <button data-bk-act="over">Over ceiling</button>
        ${q?`<button data-bk-act="visible">Select these ${shown.length}</button>`:""}
      </div>
      <div class="mselist" id="bkList">
        ${shown.length ? shown.map(s=>{
          const on = bucketAllowed(s.name);
          return `<label><input type="checkbox" data-bk="${esc(s.name)}"${on?" checked":""}>
            <span class="bn">${esc(s.name)}</span>
            <span class="meta">${s.n} MID${s.n===1?"":"s"}${
              s.flagged?` · ${s.flagged} flagged`:""}${
              s.over?` · <b>${s.over} over</b>`:""}${
              s.cb?` · ${s.cb} CB`:""}</span></label>`;
        }).join("") : `<div class="mselempty">No bucket matches “${esc(VIEW.bkQ)}”.</div>`}
      </div>
      <div class="mselfoot">${VIEW.buckets
        ? `${VIEW.buckets.size} of ${stats.length} selected — applies to the Audit and Trends views.`
        : `All ${stats.length} buckets shown. Tick a few to narrow both views.`}</div>
    </div></div>`;
}
function wireBucketPicker(){
  const btn=$("#bkBtn"), panel=$("#bkPanel");
  if(!btn) return;
  btn.onclick=e=>{
    e.stopPropagation();
    VIEW.bkOpen = !VIEW.bkOpen;
    panel.classList.toggle("open", VIEW.bkOpen);
    btn.setAttribute("aria-expanded", VIEW.bkOpen?"true":"false");
    if(VIEW.bkOpen){ const q=$("#bkQ"); if(q) q.focus(); }
  };
  if(panel) panel.onclick=e=>e.stopPropagation();

  const q=$("#bkQ");
  if(q) q.oninput=()=>{
    VIEW.bkQ=q.value;
    clearTimeout(q._h);
    q._h=setTimeout(()=>{ const pos=q.selectionStart; rerenderKeepPicker();
      const again=$("#bkQ"); if(again){again.focus(); again.setSelectionRange(pos,pos);} },200);
  };

  document.querySelectorAll("[data-bk]").forEach(cb=>{
    cb.onchange=()=>{
      const stats=bucketStats();
      const cur = VIEW.buckets ? new Set(VIEW.buckets) : new Set(stats.map(s=>s.name));
      const name = cb.getAttribute("data-bk");
      if(cb.checked) cur.add(name); else cur.delete(name);
      setBuckets(cur);
      rerenderKeepPicker();
    };
  });
  document.querySelectorAll("[data-bk-act]").forEach(b=>{
    b.onclick=()=>{
      const stats=bucketStats();
      const act=b.getAttribute("data-bk-act");
      const qq=(VIEW.bkQ||"").trim().toLowerCase();
      let set;
      if(act==="all")          set=null;
      else if(act==="none")    set=new Set();
      else if(act==="cb")      set=new Set(stats.filter(s=>s.cb>0).map(s=>s.name));
      else if(act==="flagged") set=new Set(stats.filter(s=>s.flagged>0).map(s=>s.name));
      else if(act==="over")    set=new Set(stats.filter(s=>s.over>0).map(s=>s.name));
      else if(act==="visible") set=new Set(stats.filter(s=>
                                 s.name.toLowerCase().indexOf(qq)>=0).map(s=>s.name));
      if(set===null){ VIEW.buckets=null; } else { setBuckets(set); }
      rerenderKeepPicker();
    };
  });
}
/* re-render without losing the open panel, its search text or scroll */
function rerenderKeepPicker(){
  const list=$("#bkList");
  const top = list ? list.scrollTop : 0;
  render();
  const l2=$("#bkList"); if(l2) l2.scrollTop = top;
}
document.addEventListener("click", ()=>{
  if(VIEW.bkOpen){ VIEW.bkOpen=false;
    const p=$("#bkPanel"); if(p) p.classList.remove("open");
    const b=$("#bkBtn"); if(b) b.setAttribute("aria-expanded","false"); }
});
document.addEventListener("keydown", e=>{
  if(e.key==="Escape" && VIEW.bkOpen){
    VIEW.bkOpen=false;
    const p=$("#bkPanel"); if(p) p.classList.remove("open");
  }
});
function bucketChipHTML(){
  if(!VIEW.buckets) return "";
  const names=[...VIEW.buckets];
  const shown = names.length<=2 ? names.join(", ") : names.length+" buckets";
  return `<span class="chip" title="${esc(names.join(', '))}">${esc(shown)}
    <button id="bkClear" title="Show all buckets">×</button></span>`;
}

/* ---------- filtering ---------- */
function passFilter(e){
  if(!bucketAllowed(e.b)) return false;
  if(VIEW.q){
    const q=VIEW.q.toLowerCase();
    if((e.m+" "+e.d+" "+e.id+" "+e.b).toLowerCase().indexOf(q)<0) return false;
  }
  if(VIEW.tier!=="__all" && tierOf(e)!==VIEW.tier) return false;
  return true;
}





/* ============================================================
   SNAPSHOT LIBRARY — every loaded report is kept as a tab.

   Persistence uses localStorage when the browser allows it, which
   it does when this file is opened from disk or served from a host.
   Some embedded/sandboxed viewers block storage; in that case the
   library still works for the current session and the header says
   so plainly, rather than pretending data was saved.
   ============================================================ */
const LS_KEY = "cbrc.library.v1";
const FIELD_ORDER = ["b","m","d","id","s","ds","dr","cb","cv","rn","ax","vi","mc","dc","pcbSrc","prfSrc"];

const STORE = (function(){
  let ok=false;
  try{
    const k="__cbrc_probe";
    window.localStorage.setItem(k,"1");
    window.localStorage.removeItem(k);
    ok=true;
  }catch(e){ ok=false; }
  const mem = {v:null};
  return {
    ok,
    read(){
      try{
        const raw = ok ? window.localStorage.getItem(LS_KEY) : mem.v;
        return raw ? JSON.parse(raw) : [];
      }catch(e){ return []; }
    },
    write(list){
      const raw = JSON.stringify(list);
      if(!ok){ mem.v = raw; return {ok:true}; }
      try{ window.localStorage.setItem(LS_KEY, raw); return {ok:true}; }
      catch(e){ mem.v = raw; return {ok:false, err:e}; }
    }
  };
})();

let LIB = [];        // [{id,name,stamp,label,savedAt,rows:[[...]]}]
let ACTIVE = null;   // id of the report currently on screen

function packRows(rows){ return rows.map(r=>FIELD_ORDER.map(f=>r[f])); }
function unpackRows(packed){
  return packed.map(a=>{
    const o={}; FIELD_ORDER.forEach((f,i)=>o[f]=a[i]);
    return o;
  });
}
function libLoad(){
  LIB = STORE.read().filter(s=>s && s.rows && s.rows.length);
  LIB.sort((a,b)=> String(b.stamp||b.savedAt||"").localeCompare(String(a.stamp||a.savedAt||"")));
  if(LIB.length) ACTIVE = LIB[0].id;
}
function invalidateMH(){ if(typeof _HL!=="undefined") _HL = {}; }
function libSave(){
  if(typeof invalidateMH==="function") invalidateMH();
  /* in folder mode the folder is the archive, so nothing is duplicated
     into localStorage and the 5 MB quota never comes into play */
  if(typeof folderMode==="function" && folderMode()){ STORE.write([]); return; }
  const res = STORE.write(LIB);
  if(!res.ok){
    showErr("Ran out of browser storage, so the newest report is held for this session only. "
      + "Close a few older tabs (the × on each) and add it again to keep it.");
  }
}
function snapById(id){ return LIB.find(s=>s.id===id) || null; }
function snapToSnapshot(s){
  return s ? {name:s.name, stamp:s.stamp, rows:unpackRows(s.rows)} : null;
}
function syncActive(){
  SNAP_A = snapToSnapshot(snapById(ACTIVE));
  SNAP_B = null;
  const on = !!SNAP_A;
  ["#btnSheets","#btnCsv","#btnPrint"].forEach(s=>{const b=$(s); if(b) b.disabled=!on;});
}

function niceStamp(s){
  if(!s || !/^\d{4}-\d{2}-\d{2}/.test(s)) return null;
  const M=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  const y=s.slice(0,4), mo=+s.slice(5,7), d=+s.slice(8,10), t=s.slice(11,16);
  return {short:`${d} ${M[mo-1]}`, time:t, full:`${d} ${M[mo-1]} ${y} ${t}`};
}

/* ============================================================
   MONTHLY RESET

   The portal zeroes every counter on the 1st. So each report is a
   month-to-date figure, not a running total and not a daily one.
   Three consequences the rest of the code has to respect:

     • A trend line drawn across the 1st shows a cliff that is not an
       improvement. Series are segmented by month and no delta is ever
       computed across the boundary.
     • Early in a month the denominators are tiny, so CB % swings
       wildly. Rows below MODEL.thinSales carry a "thin" marker.
     • "Versus last month" means the prior month's FINAL figures — the
       last report filed before the reset.
   ============================================================ */
const MONTH_ABBR = ["Jan","Feb","Mar","Apr","May","Jun",
                    "Jul","Aug","Sep","Oct","Nov","Dec"];

function periodOf(stamp){
  return (stamp && /^\d{4}-\d{2}/.test(stamp)) ? stamp.slice(0,7) : null;
}
function periodLabel(p){
  if(!p) return "undated";
  return MONTH_ABBR[+p.slice(5,7)-1] + " " + p.slice(0,4);
}
function dayOfMonth(stamp){
  return (stamp && /^\d{4}-\d{2}-\d{2}/.test(stamp)) ? +stamp.slice(8,10) : null;
}
function daysInMonth(p){
  if(!p) return 30;
  return new Date(+p.slice(0,4), +p.slice(5,7), 0).getDate();
}
/* distinct periods present in the library, oldest first */
function periodsInLib(){
  const seen=[];
  allSnapshotsChrono().forEach(s=>{
    const p=periodOf(s.stamp);
    if(p && seen.indexOf(p)<0) seen.push(p);
  });
  return seen;
}

function addSnapshot(snap){
  const stamp = snap.stamp || null;
  const id = (stamp || snap.name || "snap") + "|" + snap.rows.length;
  const existing = LIB.findIndex(s=>s.id===id);
  const rec = {id, name:snap.name, stamp, label:null,
               savedAt:stamp||snap.name, rows:packRows(snap.rows)};
  const wasThere = existing>=0;
  if(wasThere) LIB[existing]=rec; else LIB.push(rec);
  LIB.sort((a,b)=> String(b.stamp||b.savedAt||"").localeCompare(String(a.stamp||a.savedAt||"")));
  libSave();
  return {replaced:wasThere, id};
}
/* After a batch load, focus the newest report by its own timestamp —
   never whichever file happened to finish reading last. */
function focusNewest(ids){
  const pool = ids && ids.length ? LIB.filter(s=>ids.indexOf(s.id)>=0) : LIB;
  if(!pool.length) return;
  ACTIVE = pool[0].id;                       // LIB is sorted newest-first
}
function removeSnapshot(id){
  LIB = LIB.filter(s=>s.id!==id);
  if(ACTIVE===id) ACTIVE = LIB[0] ? LIB[0].id : null;
  libSave();
}


/* ---------- shared helpers for the trend views ---------- */
function allSnapshotsChrono(){
  return LIB.slice().sort((a,b)=>
    String(a.stamp||a.savedAt||"").localeCompare(String(b.stamp||b.savedAt||"")));
}
function sparkSVG(vals, opts){
  const o=opts||{};
  const clean = vals.map(v=> v==null||isNaN(v) ? null : v);
  const nums = clean.filter(v=>v!=null);
  if(nums.length<2) return `<svg viewBox="0 0 100 38" preserveAspectRatio="none"></svg>`;
  const min=Math.min(...nums), max=Math.max(...nums);
  const span = (max-min)||1;
  const n=clean.length;
  /* o.breaks holds indices that start a new month. The line is cut there
     rather than bridged, so a reset never looks like a fall. */
  const brk = o.breaks || {};
  const pts=[]; const segs=[]; let cur=[];
  clean.forEach((v,i)=>{
    if(brk[i] && cur.length){ segs.push(cur); cur=[]; }
    if(v!=null){
      const p=[(i/(n-1))*96+2, 34-((v-min)/span)*30];
      pts.push(p); cur.push(p);
    }
  });
  if(cur.length) segs.push(cur);
  const path = segs.map(sg=>sg.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1))
    .join(" ")).join(" ");
  const last = pts[pts.length-1];
  const col = o.color || "var(--accent)";
  const thr = o.threshold;
  let thrLine="";
  if(thr!=null && thr>=min && thr<=max){
    const y=(34-((thr-min)/span)*30).toFixed(1);
    thrLine=`<line x1="2" x2="98" y1="${y}" y2="${y}" stroke="var(--crit)"
      stroke-width="1" stroke-dasharray="3 2" opacity=".65"></line>`;
  }
  return `<svg viewBox="0 0 100 38" preserveAspectRatio="none" aria-hidden="true">
    ${thrLine}
    <path d="${path}" fill="none" stroke="${col}" stroke-width="2"
      stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"></path>
    <circle cx="${last[0].toFixed(1)}" cy="${last[1].toFixed(1)}" r="2.6" fill="${col}"
      stroke="var(--surface)" stroke-width="1.5"></circle>
  </svg>`;
}
/* arrows read as risk, not direction: invertGood flips which way is bad
   (falling sales is bad; falling chargebacks is good) */
function deltaTag(cur, prev, invertGood){
  if(prev==null||cur==null) return `<span class="dlt flat">no prior</span>`;
  const d=cur-prev;
  if(Math.abs(d)<1e-9) return `<span class="dlt flat">no change</span>`;
  const worse = invertGood ? d<0 : d>0;
  const cls = worse ? "up" : "down";
  const arrow = d>0 ? "▲" : "▼";
  return `<span class="dlt ${cls}">${arrow} ${Math.abs(d).toLocaleString("en-US",
    {maximumFractionDigits:2})}</span>`;
}

/* ============================================================
   FOLDER ACCESS — the archive lives in one folder you choose.

   What the browser can and cannot do here, honestly:
     • It CAN read every CSV in a folder you pick, and write files
       back into it (Chrome and Edge, via showDirectoryPicker).
     • It CANNOT watch the folder — nothing notifies a web page when
       a file appears, so there is a Reload button.
     • It CANNOT silently reopen the folder on a new visit. The handle
       is remembered, but one click per visit is required. That is a
       security boundary, not a setting.
     • Firefox and Safari lack the API and fall back to a one-off
       folder open.
   ============================================================ */
const FS_OK = typeof window.showDirectoryPicker === "function";
const IDB_NAME = "cbrc.fs", IDB_STORE = "handles";

function idb(){
  return new Promise((res,rej)=>{
    let req;
    try{ req = indexedDB.open(IDB_NAME,1); }catch(e){ return rej(e); }
    req.onupgradeneeded = () => {
      const db=req.result;
      if(!db.objectStoreNames.contains(IDB_STORE)) db.createObjectStore(IDB_STORE);
    };
    req.onsuccess = () => res(req.result);
    req.onerror = () => rej(req.error);
  });
}
async function idbSet(k,v){
  try{
    const db=await idb();
    return new Promise((res,rej)=>{
      const tx=db.transaction(IDB_STORE,"readwrite");
      tx.objectStore(IDB_STORE).put(v,k);
      tx.oncomplete=()=>res(true); tx.onerror=()=>rej(tx.error);
    });
  }catch(e){ return false; }
}
async function idbGet(k){
  try{
    const db=await idb();
    return new Promise((res)=>{
      const tx=db.transaction(IDB_STORE,"readonly");
      const rq=tx.objectStore(IDB_STORE).get(k);
      rq.onsuccess=()=>res(rq.result||null); rq.onerror=()=>res(null);
    });
  }catch(e){ return null; }
}
async function idbDel(k){
  try{
    const db=await idb();
    return new Promise(res=>{
      const tx=db.transaction(IDB_STORE,"readwrite");
      tx.objectStore(IDB_STORE).delete(k);
      tx.oncomplete=()=>res(true); tx.onerror=()=>res(false);
    });
  }catch(e){ return false; }
}

const FOLDER = {
  handle:null, name:null, state:"none", found:0, skipped:[],

  /* audits are written into <folder>/audits/ so the tool never reads its
     own output back in as a report, and the source folder stays exactly
     as the portal left it */
  AUDIT_DIR: "audits",
  async auditDir(){
    if(!this.handle) throw new Error("No folder connected.");
    return this.handle.getDirectoryHandle(this.AUDIT_DIR, {create:true});
  },

  async pick(){
    if(!FS_OK) throw new Error("This browser cannot open a folder handle.");
    const h = await window.showDirectoryPicker({mode:"readwrite", id:"cbrc-reports"});
    this.handle=h; this.name=h.name; this.state="connected";
    await idbSet("dir", h);
    return h;
  },
  async restore(){
    if(!FS_OK) return false;
    const h = await idbGet("dir");
    if(!h) return false;
    this.handle=h; this.name=h.name;
    let perm="prompt";
    try{ perm = await h.queryPermission({mode:"readwrite"}); }catch(e){ perm="prompt"; }
    this.state = perm==="granted" ? "connected" : "needs-permission";
    return true;
  },
  async grant(){
    if(!this.handle) return false;
    let perm="denied";
    try{ perm = await this.handle.requestPermission({mode:"readwrite"}); }catch(e){ perm="denied"; }
    this.state = perm==="granted" ? "connected" : "needs-permission";
    return this.state==="connected";
  },
  async disconnect(){
    this.handle=null; this.name=null; this.state="none"; this.found=0; this.skipped=[];
    await idbDel("dir");
  },

  /* read every portal export in the folder. Subdirectories (including
     audits/) are skipped, and our own audit files are ignored even if one
     is sitting loose in the source folder. */
  async scan(){
    if(!this.handle || this.state!=="connected") return [];
    const out=[], skipped=[];
    for await (const entry of this.handle.values()){
      if(entry.kind!=="file") continue;
      if(!/\.csv$/i.test(entry.name)) continue;
      try{
        const f = await entry.getFile();
        const text = await f.text();
        const snap = loadSnapshot(text, entry.name);
        if(snap.dateOnly && f.lastModified){
          const d=new Date(f.lastModified), p=n=>String(n).padStart(2,"0");
          snap.stamp = snap.stamp.slice(0,10)
            + ` ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
        }
        if(!snap.stamp && f.lastModified){
          const d=new Date(f.lastModified), p=n=>String(n).padStart(2,"0");
          snap.stamp = `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} `
                     + `${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
        }
        out.push(snap);
      }catch(e){
        if(e && e.isAudit) continue;                 /* our own output — ignore */
        skipped.push(entry.name+": "+(e.message||e));
      }
    }
    this.found=out.length; this.skipped=skipped;
    return out;
  },
  async writeFile(name, text){
    if(!this.handle || this.state!=="connected") throw new Error("No folder connected.");
    const dir = await this.auditDir();
    const fh = await dir.getFileHandle(name, {create:true});
    const w = await fh.createWritable();
    await w.write(new Blob([text],{type:"text/csv"}));
    await w.close();
    return name;
  },

  /* tracker state lives in its own subfolder. scan() skips directories, so
     nothing in here can ever be read back as a portal export. */
  TRACK_DIR: "tracker",
  async trackDir(create){
    if(!this.handle) throw new Error("No folder connected.");
    return this.handle.getDirectoryHandle(this.TRACK_DIR, {create:!!create});
  },
  async readTracker(){
    if(!this.handle || this.state!=="connected") return [];
    let dir;
    try{ dir = await this.trackDir(false); }
    catch(e){ return []; }                       /* no tracker/ yet — not an error */
    const files=[];
    for await (const entry of dir.values()){
      if(entry.kind!=="file" || !/\.jsonl$/i.test(entry.name)) continue;
      try{
        const text = await (await entry.getFile()).text();
        files.push({name:entry.name, text});
      }catch(e){ /* a half-synced file: skip it, the next read picks it up */ }
    }
    return files;
  },
  async writeTracker(name, text){
    if(!this.handle || this.state!=="connected") throw new Error("No folder connected.");
    const dir = await this.trackDir(true);
    const fh = await dir.getFileHandle(name, {create:true});
    const w = await fh.createWritable();
    await w.write(new Blob([text],{type:"application/x-ndjson"}));
    await w.close();
    return name;
  }
};

/* ============================================================
   TRACKER — which deals the team is acting on, and whether it worked.

   State is a log of events, never a document. Each browser appends only to
   its own file in <folder>/tracker/, so two browsers can never write the
   same file: no locking, no overwritten edit, no sync conflict copy. Every
   browser reads all the files and folds them by timestamp.

   Nothing here touches MODEL or scoring. A tracked row is identified by MID
   as a string — never a number, or the leading zero is lost and the row can
   no longer be joined to next month's export.
   ============================================================ */
const TRACK_STATUS = ["required","doing","done","closed"];
const TRACK_LABEL = {required:"Action required", doing:"In progress",
                     done:"Action done", closed:"Closed"};

/* Each action type is judged by the metric that would actually move if the
   fix landed — a generic CB % delta calls an RDR fix a failure for weeks
   while it is quietly working. Every metric here is a RATE: counts cannot be
   compared across the 1st, when the portal zeroes every counter. */
const TRACK_ACTIONS = {
  "RDR Fix (ARN Lookup)":       {metric:"cov", good:"up",   label:"RDR coverage %", dp:1},
  "MC Fix (Descriptor Lookup)": {metric:"mcs", good:"down", label:"MC share %",     dp:1},
  "Agent Flag":                 {metric:"cbp", good:"down", label:"CB %",           dp:2},
  "Watch":                      {metric:"cbp", good:"down", label:"CB %",           dp:2}
};
const TRACK_ACTION_NAMES = Object.keys(TRACK_ACTIONS);

function trackStampMs(v){
  if(!v) return null;
  const s = String(v).indexOf("T")>0 ? String(v) : String(v).replace(" ","T");
  const t = Date.parse(s);
  return isNaN(t) ? null : t;
}
const DAY_MS = 86400000;

const TRACKER = {
  LS_EV:"cbrc.tracker.v1", LS_DEV:"cbrc.tracker.device", LS_LAG:"cbrc.tracker.lag",
  mine:[], all:[], state:{}, sources:0, syncedAt:null, err:null, seq:0,

  /* Chargebacks post weeks after the sale, so a fix cannot show up at once.
     This is a SETTING, not a measured figure — there is no verified dispute
     lag for this portfolio, so it is exposed and left to the operator. */
  lagDays: 14,

  device(){
    let d=null;
    try{ d = localStorage.getItem(this.LS_DEV); }catch(e){}
    if(!d){
      d = Math.random().toString(16).slice(2,6) + Math.random().toString(16).slice(2,6);
      try{ localStorage.setItem(this.LS_DEV,d); }catch(e){}
    }
    return d;
  },
  fileName(){ return "events-"+this.device()+".jsonl"; },

  loadLocal(){
    try{
      const raw = localStorage.getItem(this.LS_EV);
      this.mine = raw ? JSON.parse(raw) : [];
      if(!Array.isArray(this.mine)) this.mine=[];
    }catch(e){ this.mine=[]; }
    try{
      const lg = localStorage.getItem(this.LS_LAG);
      if(lg!==null && lg!=="" && !isNaN(+lg)) this.lagDays = Math.max(0,Math.round(+lg));
    }catch(e){}
    this.seq = this.mine.length;
    this.fold();
  },
  saveLocal(){
    try{ localStorage.setItem(this.LS_EV, JSON.stringify(this.mine)); }catch(e){}
  },
  setLag(d){
    this.lagDays = Math.max(0, Math.round(+d||0));
    try{ localStorage.setItem(this.LS_LAG, String(this.lagDays)); }catch(e){}
  },

  /* ---- the log ---- */
  push(ev){
    const dev = this.device();
    ev.dev = dev;
    ev.id  = dev + "-" + (++this.seq);
    ev.ts  = new Date().toISOString();
    this.mine.push(ev);
    this.saveLocal();
    this.fold();
    this.flush();                                  /* fire and forget */
    return ev;
  },
  async flush(){
    if(FOLDER.state!=="connected") return false;
    /* nothing tracked yet: do not create tracker/ or drop an empty file into
       a shared drive. Untracking is itself an event, so the only way to have
       no events is never to have used the tracker at all. */
    if(!this.mine.length) return false;
    try{
      const text = this.mine.map(e=>JSON.stringify(e)).join("\n") + (this.mine.length?"\n":"");
      await FOLDER.writeTracker(this.fileName(), text);
      this.err=null; return true;
    }catch(e){ this.err = e.message||String(e); return false; }
  },
  async sync(){
    if(FOLDER.state!=="connected"){ this.sources=0; this.fold(); return false; }
    try{
      const files = await FOLDER.readTracker();
      const seen = {}, out = [];
      const take = ev => { if(ev && ev.id && !seen[ev.id]){ seen[ev.id]=1; out.push(ev); } };
      this.mine.forEach(take);

      /* Our own file is, by definition, our own history. Adopt anything in it
         that localStorage no longer has, or the next flush would rewrite the
         file from a short local list and destroy the rest — in a shared drive
         that is not just our history but our whole contribution to the team's.
         Browser storage can be evicted; the folder is the durable copy. */
      const myName = this.fileName();
      const mineSeen = {};
      this.mine.forEach(e=>{ if(e && e.id) mineSeen[e.id]=1; });
      let adopted = 0, maxSeq = this.seq;

      files.forEach(f=>{
        const isMine = f.name === myName;
        f.text.split(/\r?\n/).forEach(line=>{
          if(!line.trim()) return;
          let ev; try{ ev = JSON.parse(line); }catch(e){ return; }  /* torn line mid-sync */
          take(ev);
          if(isMine && ev && ev.id && !mineSeen[ev.id]){
            mineSeen[ev.id]=1; this.mine.push(ev); adopted++;
            const n = +String(ev.id).split("-").pop();
            if(!isNaN(n) && n>maxSeq) maxSeq = n;
          }
        });
      });
      if(adopted){
        /* keep the file chronological, and never reissue an id we already used */
        this.mine.sort((a,b)=>(trackStampMs(a.ts)||0)-(trackStampMs(b.ts)||0)
                             || String(a.id).localeCompare(String(b.id)));
        this.seq = maxSeq;
        this.saveLocal();
      }
      this.adopted = adopted;
      this.all = out;
      this.sources = files.length;
      this.syncedAt = new Date().toISOString();
      this.fold();
      await this.flush();
      this.err=null;
      return true;
    }catch(e){ this.err = e.message||String(e); return false; }
  },

  /* last event per MID wins, ordered by timestamp then id so the fold is
     deterministic when two clocks agree to the millisecond */
  fold(){
    /* Always union both logs. Reading this.all *instead of* this.mine meant
       that once a folder sync had populated this.all, every local change was
       recorded but invisible until a reload cleared it — the + button did not
       tick, and the status buttons and action dropdown appeared dead. */
    const seen={}, src=[];
    const take = e => { if(e && e.id && !seen[e.id]){ seen[e.id]=1; src.push(e); } };
    this.all.forEach(take);
    this.mine.forEach(take);
    const evs = src.sort((a,b)=>
      (trackStampMs(a.ts)||0) - (trackStampMs(b.ts)||0) || String(a.id).localeCompare(String(b.id)));
    const st = {};
    evs.forEach(ev=>{
      const mid = ev.mid; if(!mid) return;
      if(ev.op==="untrack"){ delete st[mid]; return; }
      const cur = st[mid] || (st[mid] = {mid, status:"required", action:"Watch",
                                         trackedAt:ev.ts, baseline:null, doneAt:null,
                                         note:"", updatedAt:ev.ts});
      if(ev.op==="track"){ if(ev.action) cur.action = ev.action; }
      else if(ev.op==="action"){ cur.action = ev.value; }
      else if(ev.op==="note"){ cur.note = ev.value||""; }
      else if(ev.op==="status"){
        cur.status = ev.value;
        if(ev.value==="done"){ cur.doneAt = ev.ts; if(ev.baseline) cur.baseline = ev.baseline; }
      }
      cur.updatedAt = ev.ts;
    });
    this.state = st;
    return st;
  },

  /* ---- reading ---- */
  get(mid){ return this.state[mid] || null; },
  list(){ return Object.keys(this.state).map(k=>this.state[k]); },
  byStatus(s){ return this.list().filter(r=>r.status===s); },
  counts(){
    const c={required:0,doing:0,done:0,closed:0};
    this.list().forEach(r=>{ if(c[r.status]!==undefined) c[r.status]++; });
    return c;
  },

  /* ---- writing ---- */
  track(mid, action){
    if(!mid) return null;
    return this.push({mid:String(mid), op:"track", action: action || this.suggest(mid)});
  },
  untrack(mid){ return this.push({mid:String(mid), op:"untrack"}); },
  setAction(mid, value){ return this.push({mid:String(mid), op:"action", value}); },
  setNote(mid, value){ return this.push({mid:String(mid), op:"note", value:String(value||"")}); },
  setStatus(mid, value){
    if(TRACK_STATUS.indexOf(value)<0) throw new Error("unknown status: "+value);
    const ev = {mid:String(mid), op:"status", value};
    /* the baseline is captured at Done and travels with the event, so the
       verdict cannot drift when old reports leave the library */
    if(value==="done"){
      const b = this.snapshotFor(mid);
      if(b) ev.baseline = b;
    }
    return this.push(ev);
  },

  /* the action a row's own flags argue for, used as the default */
  suggest(mid){
    const A = window.__A, e = A && A.byMid ? A.byMid[mid] : null;
    if(!e) return "Watch";
    if(e.F.indexOf("F2")>=0 || e.F.indexOf("F1")>=0) return "RDR Fix (ARN Lookup)";
    if(e.F.indexOf("F3")>=0) return "MC Fix (Descriptor Lookup)";
    return "Watch";
  },
  snapshotFor(mid){
    const A = window.__A, e = A && A.byMid ? A.byMid[mid] : null;
    if(!e) return null;
    return {stamp: (SNAP_A && SNAP_A.stamp) || null,
            cov:e.cov, cbp:e.cbp, mcs:e.mcs, s:e.s, cb:e.cb, vi:e.vi, mc:e.mc, rn:e.rn};
  },

  /* ---- did it work? ----
     Two gates before any verdict is shown: the lag window must have passed,
     and the denominator must clear the same thin floor used everywhere else.
     Below either, the honest answer is "not yet", not a number. */
  outcome(mid){
    const t = this.state[mid];
    if(!t) return null;
    const spec = TRACK_ACTIONS[t.action] || TRACK_ACTIONS["Watch"];
    const A = window.__A, cur = A && A.byMid ? A.byMid[mid] : null;
    const out = {mid, action:t.action, status:t.status, spec,
                 metric:spec.metric, metricLabel:spec.label, dp:spec.dp,
                 base:null, now:null, delta:null, verdict:"pending",
                 elapsedDays:null, sales:cur?cur.s:null, thinFloor:MODEL.thinSales,
                 reportStamp:(SNAP_A&&SNAP_A.stamp)||null,
                 baseStamp:t.baseline?t.baseline.stamp:null};

    if(t.status!=="done" && t.status!=="closed"){ out.verdict="not-done"; return out; }
    if(!t.baseline){ out.verdict="no-baseline"; return out; }
    if(!cur){ out.verdict="missing"; return out; }

    const bMs = trackStampMs(t.doneAt), rMs = trackStampMs(out.reportStamp);
    if(bMs!==null && rMs!==null) out.elapsedDays = Math.floor((rMs-bMs)/DAY_MS);

    out.base = t.baseline[spec.metric];
    out.now  = cur[spec.metric];

    if(out.base==null || out.now==null){ out.verdict="not-available"; return out; }
    /* the newest report predates the fix — there is nothing yet to measure
       against, which is a different problem from waiting out the lag */
    if(out.elapsedDays!==null && out.elapsedDays < 0){ out.verdict="no-report-since"; return out; }
    if(out.elapsedDays!==null && out.elapsedDays < this.lagDays){ out.verdict="too-early"; return out; }
    if(cur.s < MODEL.thinSales){ out.verdict="thin"; return out; }

    const r = v => +Number(v).toFixed(spec.dp);
    const rb = r(out.base), rn = r(out.now);
    out.delta = out.now - out.base;
    if(rb===rn) out.verdict = "flat";
    else if(spec.good==="up")  out.verdict = rn>rb ? "improved" : "worse";
    else                       out.verdict = rn<rb ? "improved" : "worse";
    return out;
  }
};

/* ============================================================
   THE DATA STRIP — one place, one primary action.

   The model is deliberately singular: ONE folder is your archive.
   Portal exports go in; audits are written to a subfolder inside it.
   Everything the app knows comes from that folder, so there is no
   second source of truth to reconcile.

   Dropping loose files still works for one-offs and for browsers
   without folder support; those are held for the session only.
   ============================================================ */
function newestSnap(){
  return LIB.length ? LIB[0] : null;                 // LIB is sorted newest-first
}
function dataStripHTML(){
  const n = LIB.length;
  const newest = newestSnap();
  const ns = newest ? niceStamp(newest.stamp) : null;
  const tabs = n ? LIB.map(s=>{
    const t=niceStamp(s.stamp);
    const isA = s.id===ACTIVE;
    return `<div class="tab${isA?" on":""}" data-snap="${esc(s.id)}"
        title="${esc(s.name)}${t?" — "+t.full:""} · ${s.rows.length} MIDs">
      <span class="dt">${t?esc(t.short):esc(s.name.slice(0,14))}</span>
      <span class="sub">${t?esc(t.time):s.rows.length+" MIDs"}</span>
      ${folderMode()?"":`<span class="x" data-del="${esc(s.id)}" title="Remove">&times;</span>`}
    </div>`;
  }).join("") : "";

  /* ---- state 1: nothing set up yet ---- */
  if(!FS_OK && !n){
    return `<div class="data setup"><div class="drow">
      <span class="dicon">&#128193;</span>
      <div class="dmain"><div class="dtitle">Load your portal exports</div>
        <div class="dsub">This browser cannot keep a folder connected, so open a folder of exports
          or drop the files in. Chrome or Edge can remember the folder between visits.</div></div>
      <div class="dacts"><button class="btn p big" id="btnDirFallback">Open a folder</button>
        <button class="btn" id="btnPickFiles">Choose files</button></div></div>
      <div class="dhint">Or drag CSV files anywhere on this page.</div></div>`;
  }
  if(FOLDER.state==="none" && !n){
    return `<div class="data setup"><div class="drow">
      <span class="dicon">&#128193;</span>
      <div class="dmain"><div class="dtitle">Point this at your reports folder</div>
        <div class="dsub">Exports in, audits out. Chosen once and remembered.</div></div>
      <div class="dacts"><button class="btn p big" id="btnConnect">Choose folder</button></div>
      </div>
      <ol class="steps">
        <li>Download the report from the portal with the green download icon.</li>
        <li>Save it into <b>one folder</b> you keep for this — the filename already carries the date.</li>
        <li>Choose that folder here. Every export in it becomes a tab, and audits you save go to
            <code>audits/</code> inside it.</li>
      </ol>
      <div class="dhint">Prefer not to connect a folder? Drag CSV files anywhere on this page —
        they are kept for this browser session only.</div></div>`;
  }

  /* ---- state 2: folder remembered, awaiting the once-per-visit click ---- */
  if(FOLDER.state==="needs-permission"){
    return `<div class="data"><div class="drow">
      <span class="dicon">&#128193;</span>
      <div class="dmain">
        <div class="dtitle"><span class="dot wait"></span>${esc(FOLDER.name)}</div>
        <div class="dsub">Remembered from last time. Browsers require one click per visit before a
          page may reopen a folder — this is a security boundary, not a setting.</div></div>
      <div class="dacts"><button class="btn p big" id="btnGrant">Reload folder</button>
        <button class="btn" id="btnConnect">Change</button></div></div>
      ${n?`<div class="dtabs">${tabs}</div>`:""}</div>`;
  }

  /* ---- state 3: connected ---- */
  if(FOLDER.state==="connected"){
    return `<div class="data"><div class="drow">
      <span class="dicon">&#128193;</span>
      <div class="dmain">
        <div class="dtitle"><span class="dot on"></span>${esc(FOLDER.name)}
          <span class="sub" style="font-weight:400;color:var(--muted);font-size:var(--fs-sm)">
            ${FOLDER.found} export${FOLDER.found===1?"":"s"}${ns?` · newest ${esc(ns.full)}`:""}</span>
        </div>
        <div class="dsub">Audits save to <code>${esc(FOLDER.name)}/${FOLDER.AUDIT_DIR}/</code>
          and are never read back in. Add a new export to the folder, then reload.</div></div>
      <div class="dacts">
        <button class="btn p" id="btnRescan">Reload</button>
        <button class="btn" id="btnSaveFolder">Save audit</button>
        <button class="btn" id="btnConnect">Change folder</button></div></div>
      ${n?`<div class="dtabs">${tabs}</div>`:""}
      <div class="dhint">Tabs come from the folder, so they return on every reload.
        ${FOLDER.skipped.length?`<b>${FOLDER.skipped.length} file(s) could not be read.</b>`:""}</div>
    </div>`;
  }

  /* ---- state 4: loose files only, no folder ---- */
  return `<div class="data"><div class="drow">
    <span class="dicon">&#128196;</span>
    <div class="dmain">
      <div class="dtitle"><span class="dot off"></span>${n} loose report${n===1?"":"s"}</div>
      <div class="dsub">${STORE.ok
        ? "Kept in this browser on this device. Connect a folder to build history that lives with the files."
        : "Held for this session only — this viewer blocks browser storage."}</div></div>
    <div class="dacts">
      ${FS_OK?`<button class="btn p" id="btnConnect">Choose folder</button>`:""}
      <button class="btn" id="btnPickFiles">Add files</button>
      <button class="btn" id="btnClearLib">Remove all</button></div></div>
    ${n?`<div class="dtabs">${tabs}</div>`:""}</div>`;
}

function renderDataStrip(){
  const el=$("#datastrip"); if(!el) return;
  el.innerHTML = dataStripHTML();
  const on=(id,fn)=>{const b=$(id); if(b) b.onclick=fn;};
  on("#btnConnect", connectFolder);
  on("#btnRescan", loadFromFolder);
  on("#btnSaveFolder", saveCurrentToFolder);
  on("#btnPickFiles", ()=>$("#fileA").click());
  on("#btnDirFallback", pickFolderFallback);
  on("#btnGrant", async()=>{
    if(await FOLDER.grant()) await loadFromFolder();
    else showErr("Access to the folder was not granted, so nothing was loaded.");
    renderDataStrip();
  });
  on("#btnClearLib", ()=>{
    LIB=[]; ACTIVE=null; libSave();
    renderDataStrip(); syncActive(); MT.sel=null; render();
  });
  document.querySelectorAll(".tab[data-snap]").forEach(t=>{
    t.onclick=e=>{
      if(e.target.hasAttribute("data-del")){
        e.stopPropagation();
        removeSnapshot(e.target.getAttribute("data-del"));
        renderDataStrip(); syncActive(); render(); return;
      }
      ACTIVE = t.getAttribute("data-snap");
      renderDataStrip(); syncActive(); render();
    };
  });
}

function folderMode(){ return FOLDER.state==="connected"; }

async function loadFromFolder(){
  const snaps = await FOLDER.scan();
  if(!snaps.length){
    showErr(`No CSV files found in “${esc(FOLDER.name||"that folder")}”.`
      + (FOLDER.skipped.length ? " Skipped: "+esc(FOLDER.skipped.join("; ")) : ""));
    renderDataStrip(); return 0;
  }
  LIB = [];
  const ids=[];
  snaps.forEach(s=>{ const r=addSnapshot(s); ids.push(r.id); });
  focusNewest(ids);
  renderDataStrip(); syncActive(); render();
  if(FOLDER.skipped.length){
    showErr(`Loaded ${snaps.length}, skipped ${FOLDER.skipped.length}: `
      + FOLDER.skipped.join("; "));
  } else clearErr();
  toast(`${snaps.length} report${snaps.length===1?"":"s"} loaded from ${FOLDER.name}.`);
  return snaps.length;
}

async function connectFolder(){
  try{
    await FOLDER.pick();
    await loadFromFolder();
  }catch(e){
    if(e && e.name==="AbortError") return;      // user closed the picker
    showErr("Could not open that folder: " + (e.message||e));
    renderDataStrip();
  }
}

/* fallback: <input webkitdirectory> reads a folder once, no handle kept */
function pickFolderFallback(){ $("#fileDir").click(); }

async function saveCurrentToFolder(){
  if(!folderMode()){ showErr("Connect a folder first."); return; }
  const set = exportSet("all");
  const name = auditFileName();
  let existed = false;
  try{
    await FOLDER.handle.getFileHandle(name, {create:false});
    existed = true;
  }catch(e){ existed = false; }          /* NotFoundError = new file */
  try{
    await FOLDER.writeFile(name, "﻿"+toCSV(set));
    toast(existed
      ? `Replaced ${name} in ${FOLDER.name} (${set.rows.length} rows).`
      : `Saved ${name} to ${FOLDER.name} (${set.rows.length} rows).`);
    renderDataStrip();
  }catch(e){ showErr("Could not write to the folder: " + (e.message||e)); }
}

/* ============================================================
   HISTORY AT ANY LEVEL — bucket, merchant or individual MID.

   Aggregates are built by summing the raw portal fields for the
   group and then running the same score() over the total, so a
   bucket's CB % is its real pooled rate rather than an average of
   averages. One pass per snapshot, cached against the library and
   the scoring model.
   ============================================================ */
let _HL = {};                        // cache per level
const LEVELS = [["bucket","Buckets"],["merch","Merchants"],["mid","MIDs"]];

function levelKey(r, level){
  return level==="mid" ? r.id : (level==="merch" ? r.m : r.b);
}
function historyAt(level){
  const sig = LIB.map(s=>s.id).join("|") + "::" + JSON.stringify(MODEL);
  if(_HL[level] && _HL[level].sig===sig) return _HL[level].data;
  const snaps = allSnapshotsChrono();
  const stamps = snaps.map(s=>s.stamp||s.name);
  const periods = snaps.map(s=>periodOf(s.stamp));
  const days    = snaps.map(s=>dayOfMonth(s.stamp));
  const map = new Map();
  snaps.forEach((s,si)=>{
    const groups = new Map();
    unpackRows(s.rows).forEach(raw=>{
      const e = score(raw);
      const k = levelKey(e, level);
      let g = groups.get(k);
      if(!g){
        g = {k, b:e.b, m:e.m, d:e.d, id:e.id, n:0, over:0, flagged:0, bset:new Set(),
             s:0, ds:0, dr:0, cb:0, cv:0, rn:0, ax:0, vi:0, mc:0, dc:0};
        groups.set(k,g);
      }
      g.n++; g.bset.add(e.b);
      if(e.F.indexOf("F5")>=0) g.over++;
      if(e.nf>0) g.flagged++;
      ["s","ds","dr","cb","cv","rn","ax","vi","mc","dc"].forEach(f=>g[f]+=e[f]);
      if(level!=="mid"){ g.d = g.n+" MID"+(g.n===1?"":"s"); g.id="—"; }
    });
    groups.forEach((g,k)=>{
      const agg = score({b:g.b, m:g.m, d:g.d, id:g.id, s:g.s, ds:g.ds, dr:g.dr,
                         cb:g.cb, cv:g.cv, rn:g.rn, ax:g.ax, vi:g.vi, mc:g.mc, dc:g.dc,
                         pcbSrc:"", prfSrc:""});
      let rec = map.get(k);
      if(!rec){
        rec = {key:k, level, m:g.m, d:g.d, b:g.b, id:g.id, bset:[],
               pts:new Array(snaps.length).fill(null)};
        map.set(k, rec);
      }
      rec.m=g.m; rec.d=g.d; rec.b=g.b; rec.id=g.id;
      rec.bset = [...new Set(rec.bset.concat([...g.bset]))];
      rec.pts[si] = {s:agg.s, ds:agg.ds, cb:agg.cb, cv:agg.cv, cbp:agg.cbp, rfp:agg.rfp,
                     cov:agg.cov, w:agg.w, tier:tierOf(agg),
                     f5:agg.F.indexOf("F5")>=0, zs:agg.zs, nf:agg.nf, thin:agg.thin,
                     period:periods[si], day:days[si],
                     nmids:g.n, over:g.over, flagged:g.flagged};
    });
  });
  const rows=[];
  map.forEach(rec=>{
    /* Deltas are computed inside the current month only. The portal zeroes
       every counter on the 1st, so measuring the newest report against one
       filed before the reset would read the reset itself as an improvement. */
    const idx=[]; rec.pts.forEach((p,i)=>{ if(p) idx.push(i); });
    if(!idx.length) return;
    const lastI = idx[idx.length-1];
    const curP  = periods[lastI];
    const segIdx = curP ? idx.filter(i=>periods[i]===curP) : idx;
    const useIdx = segIdx.length ? segIdx : idx;
    const seen    = idx.map(i=>rec.pts[i]);
    const segSeen = useIdx.map(i=>rec.pts[i]);
    const first = segSeen[0], last = segSeen[segSeen.length-1];
    rec.period = curP;
    rec.n = segSeen.length;      // points inside the current month
    rec.nAll = seen.length;      // points across the whole library
    rec.first=first; rec.last=last; rec.allFirst=seen[0];
    rec.everFlagged = seen.some(p=>p.nf>0 || p.flagged>0);
    rec.everCB = seen.some(p=>p.cb>0);
    rec.dcb  = last.cb - first.cb;
    rec.dsal = last.s - first.s;
    rec.dcbp = (last.cbp!=null && first.cbp!=null) ? last.cbp - first.cbp : null;
    rec.dover = last.over - first.over;
    /* the prior month's FINAL figures — the last report filed before the reset */
    const prevIdx = curP ? idx.filter(i=>periods[i] && periods[i] < curP) : [];
    rec.prev       = prevIdx.length ? rec.pts[prevIdx[prevIdx.length-1]] : null;
    rec.prevPeriod = prevIdx.length ? periods[prevIdx[prevIdx.length-1]] : null;
    if(rec.n===1){
      /* one report means no trend to read; label the point in time honestly
         rather than implying movement that has not been observed */
      if(level==="mid"){
        if(last.zs)        rec.status=["No sales","mut"];
        else if(last.f5)   rec.status=["Over ceiling","bad"];
        else if(last.nf>0) rec.status=["Flagged, not on rate","warn"];
        else               rec.status=["Not flagged","mut"];
      } else {
        rec.status = last.over>0 ? [last.over+" over ceiling","bad"]
                                 : ["None over ceiling","mut"];
      }
    }
    else if(level==="mid"){
      if(last.zs)                    rec.status=["No sales","mut"];
      else if(!rec.everFlagged)      rec.status=["Never flagged","mut"];
      else if(last.f5 && !first.f5)  rec.status=["Newly over ceiling","new"];
      else if(!last.f5 && first.f5)  rec.status=["Back under ceiling","fix"];
      else if(last.f5 && first.f5)   rec.status=["Still over ceiling","bad"];
      else if(last.nf>0)             rec.status=["Flagged, not on rate","warn"];
      else                           rec.status=["Cleared","fix"];
    } else {
      /* for a group, the honest question is how many of its MIDs sit
         over the ceiling and whether that count is falling */
      if(last.over===0 && first.over===0) rec.status=["None over ceiling","mut"];
      else if(last.over===0)              rec.status=["All cleared","fix"];
      else if(last.over < first.over)     rec.status=[`Improving · ${last.over} over`,"fix"];
      else if(last.over > first.over)     rec.status=[`Worsening · ${last.over} over`,"new"];
      else                                rec.status=[`Flat · ${last.over} over`,"bad"];
    }
    rows.push(rec);
  });
  _HL[level] = {sig, data:{stamps, periods, days, rows}};
  return _HL[level].data;
}
function invalidateHL(){ _HL = {}; }

/* ============================================================
   PER-MID TREND — every MID as one row across every report in the
   library, so you can see whether a problem is actually closing.

   Built in a single pass over all snapshots and cached against the
   library composition plus the scoring model, because changing a
   threshold has to invalidate it.
   ============================================================ */
let MT = {level:"mid", scope:"flagged", sort:"dcbp", dir:-1, q:"", limit:250, sel:null,
          norm:false};   // norm = show per-day rates instead of month-to-date totals
function midHistory(){ return historyAt(MT.level); }

function miniSpark(vals, color, threshold){
  const clean = vals.map(v=> (v==null||isNaN(v)) ? null : v);
  const nums = clean.filter(v=>v!=null);
  if(nums.length<2) return `<svg viewBox="0 0 100 30" preserveAspectRatio="none"></svg>`;
  const min=Math.min(...nums), max=Math.max(...nums), span=(max-min)||1, n=clean.length;
  const brk = miniSpark.breaks || {};
  const pts=[]; const segs=[]; let cur=[];
  clean.forEach((v,i)=>{
    if(brk[i] && cur.length){ segs.push(cur); cur=[]; }
    if(v!=null){
      const p=[(i/(n-1))*96+2, 26-((v-min)/span)*22];
      pts.push(p); cur.push(p);
    }
  });
  if(cur.length) segs.push(cur);
  const path = segs.map(sg=>sg.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1))
    .join(" ")).join(" ");
  const last = pts[pts.length-1];
  let thr="";
  if(threshold!=null && threshold>=min && threshold<=max){
    const y=(26-((threshold-min)/span)*22).toFixed(1);
    thr=`<line x1="2" x2="98" y1="${y}" y2="${y}" stroke="var(--crit)" stroke-width="1"
      stroke-dasharray="3 2" opacity=".6"></line>`;
  }
  return `<svg viewBox="0 0 100 30" preserveAspectRatio="none" aria-hidden="true">${thr}
    <path d="${path}" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round"
      stroke-linejoin="round" vector-effect="non-scaling-stroke"></path>
    <circle cx="${last[0].toFixed(1)}" cy="${last[1].toFixed(1)}" r="2.4" fill="${color}"
      stroke="var(--surface)" stroke-width="1.4"></circle></svg>`;
}
function dNum(v,dp,invertGood,single){
  if(single) return `<span class="dcell flat" title="Only one report loaded">—</span>`;
  if(v==null) return `<span class="dcell flat">—</span>`;
  if(Math.abs(v)<(dp?0.005:0.5)) return `<span class="dcell flat">0</span>`;
  const worse = invertGood ? v<0 : v>0;
  return `<span class="dcell ${worse?"up":"down"}">${v>0?"+":"−"}${
    Math.abs(v).toLocaleString("en-US",{minimumFractionDigits:dp||0,maximumFractionDigits:dp||0})
  }${dp===2?"%":""}</span>`;
}


/* ---------- the Trends view ---------- */
function mtRows(){
  const H = historyAt(MT.level);
  let rows = H.rows;
  if(MT.level==="mid"){
    if(MT.scope==="flagged")    rows = rows.filter(r=>r.everFlagged);
    else if(MT.scope==="cb")    rows = rows.filter(r=>r.everCB);
    else if(MT.scope==="open")  rows = rows.filter(r=>r.status[1]==="bad"||r.status[1]==="new");
    else if(MT.scope==="fixed") rows = rows.filter(r=>r.status[1]==="fix");
  } else {
    if(MT.scope==="flagged"||MT.scope==="cb") rows = rows.filter(r=>r.everCB);
    else if(MT.scope==="open")  rows = rows.filter(r=>r.last.over>0);
    else if(MT.scope==="fixed") rows = rows.filter(r=>r.status[1]==="fix");
  }
  if(VIEW.buckets){
    rows = rows.filter(r=> MT.level==="bucket"
      ? VIEW.buckets.has(r.key)
      : (r.bset ? r.bset.some(b=>VIEW.buckets.has(b)) : VIEW.buckets.has(r.b)));
  }
  if(MT.q.trim()){
    const q=MT.q.trim().toLowerCase();
    rows = rows.filter(r=>(r.m+" "+r.d+" "+r.id+" "+r.b+" "+r.key).toLowerCase().indexOf(q)>=0);
  }
  const key=MT.sort, dir=MT.dir;
  rows = rows.slice().sort((a,b)=>{
    const get = r => {
      switch(key){
        case "dcbp":  return r.dcbp==null?-Infinity:r.dcbp;
        case "dcb":   return r.dcb;
        case "cbp":   return r.last.cbp==null?-Infinity:r.last.cbp;
        case "cb":    return r.last.cb;
        case "s":     return r.last.s;
        case "dsal":  return r.dsal;
        case "over":  return r.last.over;
        case "dover": return r.dover;
        case "name":  return String(r.level==="mid"?r.m:r.key).toLowerCase();
        default:      return r.last.w;
      }
    };
    const x=get(a), y=get(b);
    if(typeof x==="string") return dir*x.localeCompare(y);
    return dir*(x-y) || (b.last.cb-a.last.cb);
  });
  return {all:rows, shown:rows.slice(0,MT.limit), stamps:H.stamps};
}

function trendsPageHTML(){
  const H = historyAt(MT.level);
  const nRep = H.stamps.length;
  const {all, shown} = mtRows();
  const isMid = MT.level==="mid";

  /* Where a new month starts, the counters were zeroed. In month-to-date view
     the sparklines are cut there so a reset never draws as a fall. In per-day
     view the values are already rates, so the line runs straight through. */
  const P = H.periods || [];
  const BRK = {};
  P.forEach((p,i)=>{ if(i>0 && p && P[i-1] && p!==P[i-1]) BRK[i]=1; });
  const nPeriods = [...new Set(P.filter(Boolean))].length;
  const nrm = !!MT.norm;
  miniSpark.breaks = nrm ? {} : BRK;
  /* month-to-date total ÷ day-of-month = the average day so far */
  const perDay = (v,p)=> (v==null||!p||!p.day) ? v : v/p.day;
  const val = (p,f)=> !p ? null : (nrm ? perDay(p[f],p) : p[f]);
  const counts = (()=>{ const c={bad:0,new:0,fix:0,warn:0,mut:0};
    H.rows.forEach(r=>c[r.status[1]]++); return c; })();
  const scopeOpts = isMid
    ? [["flagged","Flagged in any report"],["cb","Any chargebacks"],
       ["open","Still over / newly over"],["fixed","Back under ceiling"],["all","Every MID"]]
    : [["cb","With chargebacks"],["open","Any MID over ceiling"],
       ["fixed","Improving or cleared"],["all",MT.level==="bucket"?"Every bucket":"Every merchant"]];
  const sortOpts = (isMid
    ? [["dcbp","Δ CB % — worst first"],["dcb","Δ CB # — worst first"],["cbp","Current CB %"],
       ["cb","Current CB #"],["s","Current volume"],["dsal","Δ volume"],["name","Name"]]
    : [["over","MIDs over ceiling"],["dover","Δ MIDs over ceiling"],["dcbp","Δ CB %"],
       ["dcb","Δ CB #"],["cbp","Current CB %"],["cb","Current CB #"],
       ["s","Current volume"],["name","Name"]]);
  if(!sortOpts.some(o=>o[0]===MT.sort)) MT.sort = sortOpts[0][0];
  if(!scopeOpts.some(o=>o[0]===MT.scope)) MT.scope = scopeOpts[0][0];

  const legend = nRep<2
    ? (isMid
      ? `<span><span class="st bad"><span class="dot"></span>Over ceiling</span> ${counts.bad}</span>
         <span><span class="st warn"><span class="dot"></span>Flagged, not on rate</span> ${counts.warn}</span>
         <span><span class="st mut"><span class="dot"></span>Not flagged / no sales</span> ${counts.mut}</span>`
      : `<span><span class="st bad"><span class="dot"></span>Has MIDs over ceiling</span> ${counts.bad}</span>
         <span><span class="st mut"><span class="dot"></span>None over ceiling</span> ${counts.mut}</span>`)
    : (isMid
      ? `<span><span class="st bad"><span class="dot"></span>Still over ceiling</span> ${counts.bad}</span>
         <span><span class="st new"><span class="dot"></span>Newly over</span> ${counts.new}</span>
         <span><span class="st fix"><span class="dot"></span>Back under / cleared</span> ${counts.fix}</span>
         <span><span class="st warn"><span class="dot"></span>Flagged, not on rate</span> ${counts.warn}</span>`
      : `<span><span class="st new"><span class="dot"></span>Worsening</span> ${counts.new}</span>
         <span><span class="st bad"><span class="dot"></span>Flat</span> ${counts.bad}</span>
         <span><span class="st fix"><span class="dot"></span>Improving / cleared</span> ${counts.fix}</span>
         <span><span class="st mut"><span class="dot"></span>None over ceiling</span> ${counts.mut}</span>`);

  return portfolioTrendHTML() + `
    <h2 id="s-midtrend">Trends
      <span class="n">${all.length} ${MT.level==="bucket"?"bucket":MT.level==="merch"?"merchant":"MID"}${all.length===1?"":"s"} × ${nRep} report${nRep===1?"":"s"}</span>
      <button class="cp" data-copy="midtrend">Copy</button>
      <button class="cp" data-copy="midmatrix">Copy CB % matrix</button></h2>
    <p class="lede">One line per ${MT.level==="bucket"?"bucket":MT.level==="merch"?"merchant":"MID"},
      ${nRep<2?"showing current values from the single loaded report"
        :(nPeriods>1?"across the current month only — earlier months are shown in Versus last month below"
                    :"oldest report to newest")}. ${isMid
        ? `Status judges movement against the ${MODEL.f5Cbp}% ceiling — the threshold the card brands
           act on — so <em>Back under ceiling</em> means the problem genuinely closed.`
        : `A group's CB % is its pooled rate (total chargebacks ÷ total sales), not an average of its
           MIDs, so large MIDs dominate it as they should. Status tracks <em>how many of its MIDs sit
           over the ${MODEL.f5Cbp}% ceiling</em> and whether that count is falling — the clearest read
           on whether a bucket is being fixed.`}
      Click any row to open its full history.</p>
    <div class="legendrow">${legend}</div>
    ${nRep<2?`<div class="onerep"><b>One report loaded — no trend lines yet.</b>
      Everything below is still searchable and shows current values; add earlier exports as tabs, or
      connect a folder, and each becomes a point on the line with Δ columns filled in.</div>`:""}
    <div class="mtctrl">
      <label>Buckets</label>
      ${bucketPickerHTML()}
      <label>Level</label>
      <span class="seg">${LEVELS.map(([v,l])=>
        `<button data-lvl="${v}" class="${MT.level===v?"on":""}">${l}</button>`).join("")}</span>
      <label>Figures</label>
      <span class="seg">
        <button data-norm="0" class="${!nrm?"on":""}"
          title="Raw month-to-date counters, cut at each month reset">Month to date</button>
        <button data-norm="1" class="${nrm?"on":""}"
          title="Month-to-date divided by day of month — comparable across the reset">Per day</button>
      </span>
      <label for="mtScope">Show</label>
      <select id="mtScope">${scopeOpts.map(([v,l])=>
        `<option value="${v}"${MT.scope===v?" selected":""}>${l}</option>`).join("")}</select>
      <label for="mtSort">Sort</label>
      <select id="mtSort">${sortOpts.map(([v,l])=>
        `<option value="${v}"${MT.sort===v?" selected":""}>${l}</option>`).join("")}</select>
      <span class="searchwrap"><label for="mtQ">Search</label>
        <input type="search" id="mtQ" value="${esc(MT.q)}"
          placeholder="${MT.level==="mid"?"merchant, DBA or MID…":MT.level==="merch"?"merchant name…":"bucket name…"}">
        ${MT.q?`<button class="btn sm" id="mtClear">clear</button>`:""}</span>
      ${bucketChipHTML()}
      <span class="note" style="margin:0">${all.length>shown.length
        ? `showing ${shown.length} of ${all.length}` : `${all.length} rows`}</span>

             <span class="grp">${r.last.nmids} MID${r.last.nmids===1?"":"s"} ·
             ${r.last.flagged} flagged</span>`;
        const selCls = (MT.sel && MT.sel.level===r.level && MT.sel.key===r.key) ? " class=\"sel\"" : "";
        return `<tr${selCls} data-row="${esc(r.key)}">
          <td class="who">${who}</td>
          <td><span class="st ${r.status[1]}"><span class="dot"></span>${esc(r.status[0])}</span></td>
          <td class="n">${r.n}</td>

            <td class="n">${dNum(r.dover,0,false,r.n<2)}</td>`}
          <td><span class="mini">${miniSpark(sal,"var(--accent)")}
            <span class="v">${nrm?lS.toLocaleString("en-US",{maximumFractionDigits:1}):fmtN(r.last.s)}<small>${r.n<2?"&nbsp;":"from "+(nrm?fS.toLocaleString("en-US",{maximumFractionDigits:1}):fmtN(r.first.s))}</small></span></span></td>
          <td class="n">${dNum(dS,dpN,true,r.n<2)}</td>
          <td><span class="mini">${miniSpark(cbs,"var(--crit)")}
            <span class="v">${nrm?lC.toFixed(2):r.last.cb}<small>${r.n<2?"&nbsp;":"from "+(nrm?fC.toFixed(2):r.first.cb)}</small></span></span></td>
          <td class="n">${dNum(dC,dpN,false,r.n<2)}</td>
          <td><span class="mini">${miniSpark(cbp,"var(--serious)",MODEL.f5Cbp)}
            <span class="v">${r.last.cbp==null?"—":r.last.cbp.toFixed(2)+"%"}
              <small>${r.n<2?"&nbsp;":(r.first.cbp==null?"—":"from "+r.first.cbp.toFixed(2)+"%")}</small></span></span></td>
          <td class="n">${dNum(r.dcbp,2,false,r.n<2)}</td>
