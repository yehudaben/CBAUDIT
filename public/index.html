<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chargeback Risk Console — Paymenthelp</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='13' fill='%230b0b0b'/%3E%3Cpath d='M12 20 L26 34 L36 26 L52 44' fill='none' stroke='%23d03b3b' stroke-width='7' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
/* ===================================================================
   THEME — everything visual lives here. Edit values, reload, done.
   Nothing below this block needs touching to change appearance.

   Tokens marked  [live]  are also editable from the Design panel in
   the UI (top-right ◐ Design), which writes them at runtime and can
   copy a replacement for this block back out.
   =================================================================== */
:root{
  color-scheme:light;

  /* ---- brand + status -------------------------------------------
     Status colours are intentionally mode-invariant: the same red
     means "critical" in light and dark. Each is paired with an icon
     or text label in the UI so colour never carries meaning alone. */
  --crit:      #d03b3b;   /* [live] act-today, quarantine            */
  --serious:   #ec835a;   /* [live] high tier                        */
  --warn:      #fab219;   /* [live] monitor tier, callouts           */
  --good:      #0ca30c;   /* [live] confirmations, loaded-file names */
  --accent:    #2a78d6;   /* [live] chart bars, focus rings          */

  /* ---- surfaces + ink (light mode) ------------------------------ */
  --page:      #f9f9f7;   /* [live] page background                  */
  --surface:   #fcfcfb;   /* [live] cards, tables, panels            */
  --ink:       #0b0b0b;   /* [live] primary text                     */
  --ink2:      #52514e;   /*        secondary text                   */
  --muted:     #898781;   /*        labels, captions                 */
  --grid:      #e1e0d9;   /*        hairline rules                   */
  --axis:      #c3c2b7;   /*        stronger rules, dashed borders   */
  --border:    rgba(11,11,11,0.10);
  --wash:      rgba(11,11,11,0.025);   /* subtle row/figure tint     */
  --wash2:     rgba(11,11,11,0.05);    /* hover, pills               */

  /* ---- type ----------------------------------------------------- */
  --font:      system-ui,-apple-system,"Segoe UI",sans-serif;  /* [live] */
  --fs:        15px;      /* [live] base size; everything scales off it */
  --fs-h1:     1.55rem;
  --fs-h2:     1.20rem;
  --fs-h3:     0.90rem;
  --fs-sm:     0.83rem;
  --fs-xs:     0.72rem;
  --lh:        1.5;
  --tracking-label: .07em;   /* uppercase micro-labels */

  /* ---- shape + density ------------------------------------------
     --d is a density multiplier applied to padding and gaps.
     1 = comfortable, 0.72 = compact. The Design panel sets it. */
  --d:         1;          /* [live] */
  --r-sm:      6px;
  --r:         10px;       /* [live] card / panel radius             */
  --r-pill:    20px;
  --bw:        1px;        /* [live] card + table border weight      */
  --rail:      4px;        /* [live] coloured left rail on cards     */
  --maxw:      1240px;     /* [live] content width                   */
  --shadow:    none;       /* [live] e.g. 0 1px 2px rgba(0,0,0,.05)  */

  /* ---- table ---------------------------------------------------- */
  --zebra:     transparent;  /* [live] set to var(--wash) for stripes */
  --th-bg:     var(--surface);
}

/* ---- dark mode -------------------------------------------------
   Steps chosen for the dark surface rather than inverted, so
   contrast holds. Status colours deliberately unchanged.        */
@media (prefers-color-scheme:dark){:root:where(:not([data-theme="light"])){
  color-scheme:dark;
  --page:#0d0d0d; --surface:#1a1a19; --ink:#ffffff; --ink2:#c3c2b7;
  --muted:#898781; --grid:#2c2c2a; --axis:#383835;
  --border:rgba(255,255,255,0.10);
  --wash:rgba(255,255,255,0.03); --wash2:rgba(255,255,255,0.07);
  --accent:#3987e5;
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --page:#0d0d0d; --surface:#1a1a19; --ink:#ffffff; --ink2:#c3c2b7;
  --muted:#898781; --grid:#2c2c2a; --axis:#383835;
  --border:rgba(255,255,255,0.10);
  --wash:rgba(255,255,255,0.03); --wash2:rgba(255,255,255,0.07);
  --accent:#3987e5;
}


/* ===================================================================
   LAYOUT + COMPONENTS — written against tokens only.
   You should rarely need to edit below here to restyle.
   =================================================================== */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--page);color:var(--ink);
  font-family:var(--font);font-size:var(--fs);line-height:var(--lh);
  -webkit-font-smoothing:antialiased}
.wrap{max-width:var(--maxw);margin:0 auto;
  padding:calc(26px*var(--d)) calc(22px*var(--d)) calc(90px*var(--d))}
button,select,input{font-family:inherit;font-size:var(--fs-sm);color:var(--ink)}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:var(--r-sm)}
a{color:var(--accent)}

/* ---- header ---- */
.topbar{display:flex;flex-wrap:wrap;gap:calc(10px*var(--d));align-items:center;
  justify-content:space-between;border-bottom:2px solid var(--ink);
  padding-bottom:calc(14px*var(--d));margin-bottom:calc(18px*var(--d))}
.kick{font-size:var(--fs-xs);letter-spacing:.15em;text-transform:uppercase;
  color:var(--muted);font-weight:700}
h1{font-size:var(--fs-h1);margin:4px 0 0;letter-spacing:-.02em;font-weight:700}
.tools{display:flex;gap:calc(7px*var(--d));flex-wrap:wrap;align-items:center}
.btn{background:var(--surface);border:var(--bw) solid var(--border);border-radius:var(--r-sm);
  padding:calc(7px*var(--d)) calc(12px*var(--d));font-weight:600;color:var(--ink);
  white-space:nowrap;box-shadow:var(--shadow)}
.btn:hover{background:var(--wash2)}
.btn.p{background:var(--ink);color:var(--page);border-color:var(--ink)}
.btn.p:hover{opacity:.87}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.sm{padding:calc(4px*var(--d)) calc(9px*var(--d));font-size:var(--fs-xs)}

/* ---- thin month-to-date marker ---- */
.thinb{display:inline-block;font-size:var(--fs-xs);font-weight:700;letter-spacing:.04em;
  color:var(--ink);background:rgba(250,178,25,.18);border:1px solid var(--warn);
  border-radius:var(--r-pill);padding:0 calc(7px*var(--d));margin-left:5px;
  white-space:nowrap;cursor:help;vertical-align:1px}

/* ---- build stamp + update banner ---- */
.headline .mtd{font-weight:700;color:var(--ink2)}
.headline .mtdnote{font-size:var(--fs-sm);color:var(--ink2)}
.vchip{display:inline-block;margin-left:calc(9px*var(--d));font-size:var(--fs-xs);
  font-weight:700;letter-spacing:.06em;color:var(--muted);border:1px solid var(--grid);
  border-radius:var(--r-pill);padding:1px calc(8px*var(--d));vertical-align:4px;
  white-space:nowrap;cursor:default}
.updbar{display:none;align-items:center;gap:calc(12px*var(--d));flex-wrap:wrap;
  background:var(--warn);color:#1a1400;border-radius:var(--r-sm);
  padding:calc(9px*var(--d)) calc(13px*var(--d));margin:0 0 calc(14px*var(--d));
  font-weight:600;font-size:var(--fs-sm);line-height:var(--lh)}
.updbar.on{display:flex}
.updbar .btn{background:#1a1400;color:var(--warn);border-color:#1a1400;box-shadow:none}
.updbar .btn:hover{opacity:.85;background:#1a1400}
.updbar .btn.ghost{background:transparent;color:#1a1400;border-color:rgba(26,20,0,.35)}

/* ---- section nav ---- */
.nav{position:sticky;top:0;z-index:20;background:var(--page);
  border-bottom:1px solid var(--grid);margin:0 0 calc(6px*var(--d));
  padding:calc(7px*var(--d)) 0;display:flex;gap:calc(5px*var(--d));
  overflow-x:auto;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav a{font-size:var(--fs-xs);font-weight:650;text-decoration:none;color:var(--ink2);
  padding:calc(4px*var(--d)) calc(9px*var(--d));border-radius:var(--r-pill);
  border:1px solid transparent;white-space:nowrap}
.nav a:hover{background:var(--wash2);color:var(--ink)}
.nav a .c{color:var(--muted);font-weight:500}
.nav a.on{border-color:var(--border);background:var(--surface);color:var(--ink)}

/* ---- loader ---- */
.loader{background:var(--surface);border:var(--bw) solid var(--border);
  border-radius:var(--r);overflow:hidden;margin-bottom:calc(20px*var(--d));box-shadow:var(--shadow)}
.lgrid{display:grid;grid-template-columns:1fr 1fr}
@media (max-width:760px){.lgrid{grid-template-columns:1fr}}
.drop{padding:calc(26px*var(--d)) calc(22px*var(--d));text-align:center;
  border:2px dashed var(--axis);border-radius:var(--r);margin:calc(14px*var(--d));
  transition:background .12s,border-color .12s}
.drop.hot{border-color:var(--accent);background:var(--wash)}
.drop h3{margin:0 0 5px;font-size:var(--fs-h3);text-transform:none;letter-spacing:0;color:var(--ink)}
.drop p{margin:0;font-size:var(--fs-sm);color:var(--ink2)}
.drop .fname{margin-top:9px;font-size:var(--fs-xs);font-weight:700;color:var(--good)}
.drop.opt{border-style:dotted}
.hint{padding:0 calc(16px*var(--d)) calc(15px*var(--d));font-size:var(--fs-xs);
  color:var(--muted);line-height:1.6}
.hint code{background:var(--wash2);padding:1px 5px;border-radius:4px}

/* ---- headline + tiles ---- */
.headline{margin:calc(18px*var(--d)) 0 6px;padding:calc(16px*var(--d)) calc(18px*var(--d));
  background:var(--surface);border:var(--bw) solid var(--border);
  border-left:var(--rail) solid var(--crit);border-radius:var(--r);
  font-size:calc(var(--fs) + 1px);line-height:1.5;box-shadow:var(--shadow)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(142px,1fr));
  gap:calc(9px*var(--d));margin:calc(16px*var(--d)) 0 6px}
.tile{background:var(--surface);border:var(--bw) solid var(--border);border-radius:var(--r);
  padding:calc(12px*var(--d)) calc(14px*var(--d));box-shadow:var(--shadow)}
.tile .lab{font-size:var(--fs-xs);letter-spacing:var(--tracking-label);text-transform:uppercase;
  color:var(--muted);font-weight:700}
.tile .val{font-size:calc(var(--fs) * 1.68);font-weight:700;letter-spacing:-.025em;
  margin-top:4px;line-height:1.1}
.tile .sub{font-size:var(--fs-xs);color:var(--ink2);margin-top:2px}
.tile.c .val{color:var(--crit)}

/* ---- controls ---- */
.ctrls{display:flex;flex-wrap:wrap;gap:calc(8px*var(--d));align-items:center;
  margin:calc(16px*var(--d)) 0 4px;background:var(--surface);
  border:var(--bw) solid var(--border);border-radius:var(--r);
  padding:calc(11px*var(--d)) calc(13px*var(--d));box-shadow:var(--shadow)}
.ctrls label{font-size:var(--fs-xs);letter-spacing:.06em;text-transform:uppercase;
  color:var(--muted);font-weight:700}
.ctrls select,.ctrls input[type=search]{background:var(--page);
  border:1px solid var(--border);border-radius:var(--r-sm);padding:calc(5px*var(--d)) 8px}
.ctrls input[type=search]{min-width:190px;flex:1 1 190px;max-width:320px}
.sp{flex:1}

/* ---- panels (model + design) ---- */
details.panel{margin:calc(10px*var(--d)) 0 0;background:var(--surface);
  border:var(--bw) solid var(--border);border-radius:var(--r);box-shadow:var(--shadow)}
details.panel>summary{padding:calc(11px*var(--d)) calc(14px*var(--d));
  font-weight:700;font-size:var(--fs-sm)}
.pgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));
  gap:calc(12px*var(--d));padding:4px calc(14px*var(--d)) calc(16px*var(--d))}
.prow{font-size:var(--fs-sm)}
.prow b{display:block;margin-bottom:5px;font-size:var(--fs-xs);font-weight:700}
.prow input[type=number]{width:76px;background:var(--page);border:1px solid var(--border);
  border-radius:5px;padding:4px 6px;font-variant-numeric:tabular-nums}
.prow input[type=color]{width:38px;height:26px;padding:0;border:1px solid var(--border);
  border-radius:5px;background:none;vertical-align:middle}
.prow input[type=range]{width:100%;accent-color:var(--accent)}
.prow select{width:100%;background:var(--page);border:1px solid var(--border);
  border-radius:5px;padding:4px 6px}
.prow span{color:var(--muted);font-size:var(--fs-xs)}
.prow .v{font-variant-numeric:tabular-nums;color:var(--ink);font-weight:650}
.pnote{padding:0 calc(14px*var(--d)) calc(14px*var(--d));font-size:var(--fs-xs);
  color:var(--muted);line-height:1.6}
.pfoot{display:flex;gap:7px;flex-wrap:wrap;padding:0 calc(14px*var(--d)) calc(14px*var(--d))}
.swatchrow{display:flex;align-items:center;gap:8px}
.cx{font-size:var(--fs-xs);font-variant-numeric:tabular-nums;padding:1px 5px;border-radius:4px}
.cx.ok{color:var(--good)} .cx.no{color:var(--crit);font-weight:700}

/* ---- section headings ---- */
h2{font-size:var(--fs-h2);margin:calc(38px*var(--d)) 0 4px;font-weight:700;
  letter-spacing:-.01em;padding-bottom:calc(8px*var(--d));border-bottom:1px solid var(--grid);
  display:flex;align-items:baseline;gap:calc(9px*var(--d));flex-wrap:wrap;scroll-margin-top:60px}
h2 .n{color:var(--muted);font-weight:500;font-size:var(--fs-sm)}
h2 .cp{margin-left:auto;font-size:var(--fs-xs);font-weight:600;
  padding:calc(4px*var(--d)) calc(9px*var(--d));border-radius:var(--r-sm);
  border:1px solid var(--border);background:var(--wash);cursor:pointer;color:var(--ink2)}
h2 .cp:hover{background:var(--wash2);color:var(--ink)}
h3{font-size:var(--fs-h3);margin:calc(22px*var(--d)) 0 calc(8px*var(--d));
  font-weight:700;color:var(--ink2);text-transform:none;letter-spacing:0}
p.lede{color:var(--ink2);font-size:var(--fs-sm);margin:calc(8px*var(--d)) 0 calc(14px*var(--d));
  max-width:78ch}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:var(--fs-xs);font-weight:700;
  letter-spacing:.05em;text-transform:uppercase;padding:3px 9px;border-radius:var(--r-pill);
  border:1px solid var(--border);background:var(--wash);white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;flex:none}
.d-c{background:var(--crit)}.d-h{background:var(--serious)}
.d-m{background:var(--warn)}.d-i{background:var(--muted)}

/* ---- cards ---- */
.card{background:var(--surface);border:var(--bw) solid var(--border);border-radius:var(--r);
  padding:calc(13px*var(--d)) calc(15px*var(--d));margin-bottom:calc(8px*var(--d));
  border-left:var(--rail) solid var(--crit);box-shadow:var(--shadow)}
.card.h{border-left-color:var(--serious)}
.card .r1{display:flex;flex-wrap:wrap;align-items:baseline;gap:calc(7px*var(--d)) calc(9px*var(--d))}
.card .nm{font-weight:700;font-size:var(--fs)}
.card .dba{color:var(--ink2);font-size:var(--fs-sm)}
.card .mid{font-size:var(--fs-xs);color:var(--muted);font-variant-numeric:tabular-nums}
.card .r2{font-size:var(--fs-xs);color:var(--ink2);margin:5px 0 6px;display:flex;
  flex-wrap:wrap;gap:4px 7px;align-items:center}
.card .sc{font-weight:700;color:var(--ink)}
.card .figs{font-size:var(--fs-sm);font-variant-numeric:tabular-nums;background:var(--wash);
  border-radius:var(--r-sm);padding:calc(7px*var(--d)) calc(9px*var(--d));line-height:1.65}
.card .act{font-size:var(--fs-sm);margin-top:calc(7px*var(--d))}
.card .act .ar{color:var(--crit);font-weight:700;margin-right:5px}
.pill{display:inline-block;font-size:var(--fs-xs);font-weight:700;padding:1.5px 5px;
  border-radius:4px;background:var(--wash2);border:1px solid var(--border);margin-right:3px;
  font-variant-numeric:tabular-nums}

/* ---- tables ---- */
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:4px 0}
table{width:100%;border-collapse:collapse;font-size:var(--fs-sm);background:var(--surface);
  border:var(--bw) solid var(--border);border-radius:var(--r-sm)}
th{text-align:left;font-size:var(--fs-xs);letter-spacing:var(--tracking-label);
  text-transform:uppercase;color:var(--muted);font-weight:700;
  padding:calc(8px*var(--d)) calc(9px*var(--d));border-bottom:1px solid var(--axis);
  white-space:nowrap;position:sticky;top:0;background:var(--th-bg);cursor:pointer;user-select:none}
th:hover{color:var(--ink)}
th.na{cursor:default}th.na:hover{color:var(--muted)}
th .ar{opacity:.45;font-size:9px}
td{padding:calc(7px*var(--d)) calc(9px*var(--d));border-bottom:1px solid var(--grid);
  vertical-align:top}
tr:last-child td{border-bottom:none}
tbody tr:nth-child(even){background:var(--zebra)}
tbody tr:hover{background:var(--wash2)}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
td.mono{font-variant-numeric:tabular-nums;font-size:var(--fs-xs);color:var(--muted);white-space:nowrap}
ul.flat{list-style:none;padding:0;margin:4px 0}
ul.flat li{padding:calc(7px*var(--d)) calc(11px*var(--d));border:var(--bw) solid var(--border);
  border-top:none;font-size:var(--fs-sm);display:flex;flex-wrap:wrap;gap:3px 9px;
  align-items:baseline;background:var(--surface)}
ul.flat li:nth-child(even){background:var(--zebra)}
ul.flat li:first-child{border-top:var(--bw) solid var(--border);
  border-radius:var(--r-sm) var(--r-sm) 0 0}
ul.flat li:last-child{border-radius:0 0 var(--r-sm) var(--r-sm)}
ul.flat .nm{font-weight:650}ul.flat .dba{color:var(--ink2)}
ul.flat .tr{margin-left:auto;font-variant-numeric:tabular-nums;color:var(--ink)}

/* ---- callouts + chart ---- */
.callout{background:var(--surface);border:var(--bw) solid var(--border);border-radius:var(--r);
  padding:calc(13px*var(--d)) calc(15px*var(--d));margin-bottom:calc(8px*var(--d));
  border-left:var(--rail) solid var(--warn);box-shadow:var(--shadow)}
.callout.na{border-left-color:var(--muted)}
.callout.cr{border-left-color:var(--crit)}
.callout .ttl{font-weight:700;font-size:var(--fs-h3);margin-bottom:4px;color:var(--ink)}
.callout p{margin:4px 0 0;font-size:var(--fs-sm);color:var(--ink2);line-height:1.55}
.callout p strong{color:var(--ink)}
.chart{background:var(--surface);border:var(--bw) solid var(--border);border-radius:var(--r);
  padding:calc(15px*var(--d)) calc(15px*var(--d)) calc(8px*var(--d));box-shadow:var(--shadow)}
.lgnd{display:flex;gap:15px;font-size:var(--fs-xs);color:var(--ink2);
  margin-bottom:calc(12px*var(--d));flex-wrap:wrap}
.lgnd span{display:inline-flex;align-items:center;gap:6px}
.lgnd i{width:11px;height:11px;border-radius:2px;flex:none}
.brow{display:grid;grid-template-columns:184px 1fr 54px;gap:10px;align-items:center;
  margin-bottom:calc(6px*var(--d));font-size:var(--fs-sm)}
.bl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.btrack{background:var(--grid);border-radius:3px;height:calc(14px*var(--d));overflow:hidden}
.bfill{height:100%;border-radius:0 4px 4px 0;background:var(--accent)}
.bfill.z{background:var(--crit)}
.brow:hover .bfill{opacity:.82}
.bv{text-align:right;font-variant-numeric:tabular-nums;font-weight:650}
.zm{font-size:var(--fs-xs);color:var(--crit);font-weight:700}
.note{font-size:var(--fs-xs);color:var(--muted);margin-top:calc(11px*var(--d));line-height:1.6}
.empty{padding:calc(40px*var(--d)) 20px;text-align:center;color:var(--muted);font-size:var(--fs-sm)}


/* ---- snapshot tabs ---- */
.libbar{display:flex;flex-direction:column;gap:calc(8px*var(--d));
  margin-bottom:calc(14px*var(--d))}
.tabs{display:flex;gap:calc(5px*var(--d));align-items:stretch;overflow-x:auto;
  scrollbar-width:thin;padding-bottom:2px}
.tab{display:flex;align-items:center;gap:7px;background:var(--surface);
  border:var(--bw) solid var(--border);border-bottom-width:3px;
  border-radius:var(--r-sm) var(--r-sm) 0 0;padding:calc(8px*var(--d)) calc(12px*var(--d));
  font-size:var(--fs-sm);white-space:nowrap;cursor:pointer;color:var(--ink2)}
.tab:hover{background:var(--wash2);color:var(--ink)}
.tab.on{border-bottom-color:var(--accent);color:var(--ink);font-weight:700;background:var(--page)}
.tab.cmp{border-bottom-color:var(--serious)}
.tab .dt{font-variant-numeric:tabular-nums}
.tab .sub{font-size:var(--fs-xs);color:var(--muted);font-weight:400}
.tab .x{opacity:.4;font-size:15px;line-height:1;padding:0 2px;border-radius:3px}
.tab .x:hover{opacity:1;color:var(--crit);background:var(--wash2)}
.tab .cmark{font-size:var(--fs-xs);color:var(--serious);font-weight:700}
.tabadd{background:none;border:1px dashed var(--axis);border-radius:var(--r-sm);
  padding:calc(8px*var(--d)) calc(13px*var(--d));font-size:var(--fs-sm);font-weight:650;
  color:var(--ink2);white-space:nowrap}
.tabadd:hover{border-color:var(--accent);color:var(--ink);background:var(--wash)}
.libmeta{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;font-size:var(--fs-xs);
  color:var(--muted)}
.libmeta select{background:var(--page);border:1px solid var(--border);border-radius:var(--r-sm);
  padding:3px 7px;font-size:var(--fs-xs);color:var(--ink)}
.store-warn{color:var(--serious);font-weight:650}
.store-ok{color:var(--good);font-weight:650}

/* ---- drop overlay (whole-page target) ---- */
.dz{position:fixed;inset:0;z-index:200;background:rgba(11,11,11,.55);
  display:none;align-items:center;justify-content:center;backdrop-filter:blur(2px)}
.dz.on{display:flex}
.dz .inner{background:var(--surface);border:3px dashed var(--accent);border-radius:var(--r);
  padding:44px 60px;text-align:center;max-width:520px}
.dz h3{margin:0 0 6px;font-size:calc(var(--fs)*1.25);color:var(--ink)}
.dz p{margin:0;font-size:var(--fs-sm);color:var(--ink2)}

/* ---- merchant history ---- */
.msearch{display:flex;gap:calc(8px*var(--d));flex-wrap:wrap;align-items:center;
  background:var(--surface);border:var(--bw) solid var(--border);border-radius:var(--r);
  padding:calc(11px*var(--d)) calc(13px*var(--d));box-shadow:var(--shadow)}
.msearch input{flex:1 1 260px;background:var(--page);border:1px solid var(--border);
  border-radius:var(--r-sm);padding:calc(7px*var(--d)) 10px;font-size:var(--fs-sm)}
.mres{list-style:none;padding:0;margin:calc(8px*var(--d)) 0 0;max-height:290px;overflow:auto;
  border:var(--bw) solid var(--border);border-radius:var(--r-sm);background:var(--surface)}
.mres:empty{display:none}
.mres li{padding:calc(7px*var(--d)) calc(11px*var(--d));border-bottom:1px solid var(--grid);
  cursor:pointer;display:flex;gap:9px;align-items:baseline;flex-wrap:wrap;font-size:var(--fs-sm)}
.mres li:last-child{border-bottom:none}
.mres li:hover{background:var(--wash2)}
.mres .nm{font-weight:650}
.mres .dba{color:var(--ink2)}
.mres .mid{font-size:var(--fs-xs);color:var(--muted);font-variant-numeric:tabular-nums}
.mres .tg{margin-left:auto;font-size:var(--fs-xs)}
.mcard{background:var(--surface);border:var(--bw) solid var(--border);border-radius:var(--r);
  padding:calc(15px*var(--d)) calc(17px*var(--d));margin-top:calc(10px*var(--d));box-shadow:var(--shadow)}
.mhead{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:baseline;
  padding-bottom:calc(10px*var(--d));border-bottom:1px solid var(--grid);margin-bottom:calc(12px*var(--d))}
.mhead .nm{font-size:calc(var(--fs)*1.15);font-weight:700}
.mhead .dba{color:var(--ink2)}
.mhead .mid{font-size:var(--fs-xs);color:var(--muted);font-variant-numeric:tabular-nums}
.mhead .close{margin-left:auto;font-size:var(--fs-xs);background:var(--wash);
  border:1px solid var(--border);border-radius:var(--r-sm);padding:3px 9px;color:var(--ink2)}
.sparks{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));
  gap:calc(12px*var(--d));margin-bottom:calc(14px*var(--d))}
.spark{border:1px solid var(--border);border-radius:var(--r-sm);padding:calc(10px*var(--d))}
.spark .lab{font-size:var(--fs-xs);letter-spacing:var(--tracking-label);text-transform:uppercase;
  color:var(--muted);font-weight:700}
.spark .now{font-size:calc(var(--fs)*1.3);font-weight:700;letter-spacing:-.02em;
  font-variant-numeric:tabular-nums;margin:2px 0 4px}
.spark .dlt{font-size:var(--fs-xs);font-variant-numeric:tabular-nums;font-weight:650}
.spark svg{display:block;width:100%;height:38px;margin-top:5px;overflow:visible}
.up{color:var(--crit)} .down{color:var(--good)} .flat{color:var(--muted)}

/* ---- export preview: thick group separators ---- */
table.exp td.gsep,table.exp th.gsep{border-right:2px solid var(--ink)}
table.exp td{white-space:nowrap;max-width:230px;overflow:hidden;text-overflow:ellipsis}
table.exp{font-size:var(--fs-xs)}
table.exp th{background:var(--wash2);color:var(--ink)}
.expwrap{margin-top:calc(8px*var(--d))}
.expwrap .note{margin-top:calc(8px*var(--d))}


/* ---- folder connection ---- */
.folderbar{display:flex;flex-wrap:wrap;gap:calc(7px*var(--d));align-items:center;
  font-size:var(--fs-xs);color:var(--muted);padding-top:calc(4px*var(--d))}
.folderbar .fname{font-weight:700;color:var(--ink);font-size:var(--fs-xs)}
.folderbar .sep{opacity:.4}
.fmode{display:inline-flex;align-items:center;gap:5px;font-weight:700}
.fmode .dot{width:7px;height:7px;border-radius:50%}
.fmode.on .dot{background:var(--good)} .fmode.on{color:var(--good)}
.fmode.off .dot{background:var(--muted)}
.fmode.warn .dot{background:var(--serious)} .fmode.warn{color:var(--serious)}
.reconnect{background:var(--surface);border:1px solid var(--serious);color:var(--ink);
  border-radius:var(--r-sm);padding:calc(5px*var(--d)) calc(10px*var(--d));font-weight:700;
  font-size:var(--fs-xs)}
.reconnect:hover{background:var(--wash2)}

/* ---- portfolio trend ---- */
.trend{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:calc(10px*var(--d));margin-bottom:calc(12px*var(--d))}


/* ---- per-MID trend table ---- */
table.mt td{white-space:nowrap;vertical-align:middle}
table.mt .who{max-width:215px;overflow:hidden;text-overflow:ellipsis}
table.mt{font-size:var(--fs-sm)}
table.mt td,table.mt th{padding:calc(6px*var(--d)) calc(7px*var(--d))}
table.mt .who .nm{font-weight:650}
table.mt .who .dba{color:var(--ink2);font-size:var(--fs-xs)}
table.mt .who .mid{color:var(--muted);font-size:var(--fs-xs);font-variant-numeric:tabular-nums}
.mini{display:flex;align-items:center;gap:7px}
.mini svg{width:62px;height:22px;flex:none;overflow:visible}
.mini .v{font-variant-numeric:tabular-nums;font-weight:650;min-width:46px;text-align:right;
  font-size:var(--fs-sm)}
.mini .v small{display:block;font-weight:400;color:var(--muted);font-size:var(--fs-xs)}
.st{font-size:var(--fs-xs);font-weight:700;padding:2px 7px;border-radius:var(--r-pill);
  border:1px solid var(--border);white-space:nowrap;display:inline-flex;align-items:center;gap:5px}
.st .dot{width:7px;height:7px;border-radius:50%}
.st.bad{color:var(--crit)} .st.bad .dot{background:var(--crit)}
.st.new{color:var(--crit)} .st.new .dot{background:var(--crit)}
.st.fix{color:var(--good)} .st.fix .dot{background:var(--good)}
.st.warn{color:var(--serious)} .st.warn .dot{background:var(--serious)}
.st.mut{color:var(--muted)} .st.mut .dot{background:var(--muted)}
.dcell{font-variant-numeric:tabular-nums;font-weight:700}
.mtctrl{display:flex;flex-wrap:wrap;gap:calc(8px*var(--d));align-items:center;
  background:var(--surface);border:var(--bw) solid var(--border);border-radius:var(--r);
  padding:calc(11px*var(--d)) calc(13px*var(--d));margin-bottom:calc(8px*var(--d));
  box-shadow:var(--shadow)}
.mtctrl label{font-size:var(--fs-xs);letter-spacing:.06em;text-transform:uppercase;
  color:var(--muted);font-weight:700}
.mtctrl select,.mtctrl input{background:var(--page);border:1px solid var(--border);
  border-radius:var(--r-sm);padding:calc(5px*var(--d)) 8px;font-size:var(--fs-sm)}
.legendrow{display:flex;gap:14px;flex-wrap:wrap;font-size:var(--fs-xs);color:var(--muted);
  margin:calc(6px*var(--d)) 0 calc(10px*var(--d))}


/* ---- top-level view switch ---- */
.views{display:flex;gap:calc(4px*var(--d));align-items:center;flex-wrap:wrap;
  border-bottom:2px solid var(--ink);margin:0 0 calc(16px*var(--d))}
.views button{background:none;border:none;border-bottom:3px solid transparent;
  padding:calc(9px*var(--d)) calc(15px*var(--d));font-size:calc(var(--fs)*0.97);
  font-weight:650;color:var(--ink2);margin-bottom:-2px;border-radius:var(--r-sm) var(--r-sm) 0 0}
.views button:hover{color:var(--ink);background:var(--wash)}
.views button.on{color:var(--ink);font-weight:700;border-bottom-color:var(--crit)}
.views button .c{color:var(--muted);font-weight:500;font-size:var(--fs-xs);margin-left:5px}
.views .sp{flex:1}
.views .ctx{font-size:var(--fs-xs);color:var(--muted);padding-right:4px}

/* ---- tracker ------------------------------------------------------
   Written against the theme tokens above, like everything else. The
   track toggle sits inside an existing cell so no table gains a column. */
.trk{display:inline-flex;align-items:center;justify-content:center;
  width:18px;height:18px;margin-right:6px;padding:0;flex:none;vertical-align:baseline;
  font-size:var(--fs-xs);font-weight:700;line-height:1;cursor:pointer;
  background:var(--surface);color:var(--muted);
  border:1px solid var(--axis);border-radius:var(--r-sm)}
.trk:hover{color:var(--ink);background:var(--wash2);border-color:var(--ink)}
.trk.on{background:var(--good);border-color:var(--good);color:#fff}
.trkhead{display:flex;gap:calc(6px*var(--d));align-items:center;flex-wrap:wrap;
  margin:calc(10px*var(--d)) 0 calc(6px*var(--d))}
.trkhead .sp{flex:1}
.trktabs{display:flex;gap:2px}
.trktabs button{background:none;border:1px solid var(--axis);border-radius:var(--r-sm);
  padding:calc(5px*var(--d)) calc(11px*var(--d));font-weight:600;color:var(--ink2);cursor:pointer}
.trktabs button.on{background:var(--ink);color:var(--page);border-color:var(--ink)}
.trktabs button .c{opacity:.65;margin-left:5px;font-weight:500}
.agrp{border:1px solid var(--grid);border-radius:var(--r-sm);margin:calc(8px*var(--d)) 0;
  overflow:hidden;background:var(--surface)}
.agrp .ahd{padding:calc(6px*var(--d)) calc(11px*var(--d));font-weight:700;
  font-size:var(--fs-sm);background:var(--wash);border-bottom:1px solid var(--grid)}
.agrp .ahd .n{color:var(--muted);font-weight:500;margin-left:6px}
.trow,.orow{padding:calc(8px*var(--d)) calc(11px*var(--d));border-top:1px solid var(--grid)}
.agrp .trow:first-of-type{border-top:none}
.orow{border:1px solid var(--grid);border-radius:var(--r-sm);background:var(--surface);
  margin:calc(6px*var(--d)) 0}
.trow .tmain,.orow .tmain{display:flex;gap:7px;align-items:baseline;flex-wrap:wrap}
.trow .nm,.orow .nm{font-weight:700}
.trow .dba,.orow .dba{color:var(--ink2)}
.trow .mid,.orow .mid{font-variant-numeric:tabular-nums;font-size:var(--fs-xs);color:var(--muted)}
.trow .tmeta,.orow .tmeta{display:flex;gap:calc(8px*var(--d));align-items:center;
  flex-wrap:wrap;margin-top:calc(5px*var(--d))}
.trow .cur,.orow .cur{font-size:var(--fs-sm);color:var(--ink2)}
.orow .ac{font-size:var(--fs-xs);font-weight:700;padding:1.5px 6px;border-radius:var(--r-sm);
  background:var(--wash2);color:var(--ink2)}
.trkact{padding:3px 6px;border:1px solid var(--axis);border-radius:var(--r-sm);
  background:var(--surface)}
.trkst{display:inline-flex;gap:2px;flex-wrap:wrap}
.trkst button{background:var(--surface);border:1px solid var(--axis);color:var(--ink2);
  padding:3px calc(8px*var(--d));font-size:var(--fs-xs);font-weight:600;cursor:pointer;
  border-radius:var(--r-sm)}
.trkst button:hover{color:var(--ink);background:var(--wash2)}
.trkst button.on{background:var(--ink);color:var(--page);border-color:var(--ink)}
.trkx,.trkc{background:none;border:1px solid transparent;color:var(--muted);
  font-size:var(--fs-xs);font-weight:600;cursor:pointer;padding:3px 7px;border-radius:var(--r-sm)}
.trkx:hover{color:var(--crit);border-color:var(--crit)}
.trkc{border-color:var(--axis);color:var(--ink2)}
.trkc:hover{color:var(--ink);border-color:var(--ink)}
.vd{font-size:var(--fs-xs);font-weight:700;padding:1.5px 7px;border-radius:var(--r-sm);
  border:1px solid currentColor}
.vd.v-ok{color:var(--good)}
.vd.v-no{color:var(--crit)}
.vd.v-wt{color:var(--warn)}
.vd.v-fl{color:var(--muted)}
.orow .dlt{font-variant-numeric:tabular-nums;font-size:var(--fs-xs);color:var(--muted);margin-left:4px}
.tile.g .val{color:var(--good)}
.bkt{font-size:var(--fs-xs);color:var(--ink2);background:var(--wash2);
  padding:1.5px 6px;border-radius:var(--r-sm);white-space:nowrap}

/* ---- level segmented control ---- */
.seg{display:inline-flex;border:var(--bw) solid var(--border);border-radius:var(--r-sm);
  overflow:hidden;background:var(--page)}
.seg button{background:none;border:none;padding:calc(5px*var(--d)) calc(12px*var(--d));
  font-size:var(--fs-sm);font-weight:650;color:var(--ink2)}
.seg button+button{border-left:1px solid var(--border)}
.seg button.on{background:var(--ink);color:var(--page)}
.seg button:hover:not(.on){background:var(--wash2);color:var(--ink)}
table.mt tbody tr{cursor:pointer}
table.mt tbody tr.sel{background:var(--wash2)}
table.mt .grp{font-size:var(--fs-xs);color:var(--muted)}


/* ---- bucket multi-select ---- */
.msel{position:relative;display:inline-block}
.mselbtn{background:var(--page);border:1px solid var(--border);border-radius:var(--r-sm);
  padding:calc(5px*var(--d)) calc(10px*var(--d));font-size:var(--fs-sm);color:var(--ink);
  display:inline-flex;align-items:center;gap:7px;max-width:330px}
.mselbtn:hover{background:var(--wash2)}
.mselbtn.active{border-color:var(--accent);font-weight:650}
.mselbtn .lbl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mselbtn .cnt{background:var(--wash2);border-radius:var(--r-pill);padding:0 6px;
  font-size:var(--fs-xs);font-variant-numeric:tabular-nums;color:var(--ink2)}
.mselbtn .car{opacity:.5;font-size:10px}
.mselpanel{position:absolute;z-index:40;top:calc(100% + 4px);left:0;min-width:330px;
  max-width:420px;background:var(--surface);border:var(--bw) solid var(--border);
  border-radius:var(--r);box-shadow:0 6px 22px rgba(0,0,0,.16);padding:calc(9px*var(--d));
  display:none}
.mselpanel.open{display:block}
.mselpanel input[type=search]{width:100%;background:var(--page);border:1px solid var(--border);
  border-radius:var(--r-sm);padding:calc(6px*var(--d)) 9px;font-size:var(--fs-sm);
  margin-bottom:calc(7px*var(--d))}
.mselacts{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:calc(7px*var(--d));
  padding-bottom:calc(7px*var(--d));border-bottom:1px solid var(--grid)}
.mselacts button{background:var(--page);border:1px solid var(--border);border-radius:var(--r-sm);
  padding:3px 8px;font-size:var(--fs-xs);font-weight:650;color:var(--ink2)}
.mselacts button:hover{background:var(--wash2);color:var(--ink)}
.mselist{max-height:290px;overflow-y:auto;margin:0 -4px}
.mselist label{display:flex;align-items:baseline;gap:8px;padding:calc(5px*var(--d)) 6px;
  border-radius:var(--r-sm);cursor:pointer;font-size:var(--fs-sm);
  /* the surrounding .ctrls/.mtctrl label rule uppercases micro-labels;
     these are real names and must not inherit that */
  text-transform:none;letter-spacing:normal;color:var(--ink);font-weight:400}
.mselist label:hover{background:var(--wash2)}
.mselist input{margin:0;flex:none;accent-color:var(--accent);position:relative;top:2px}
.mselist .bn{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mselist .meta{font-size:var(--fs-xs);color:var(--muted);font-variant-numeric:tabular-nums;
  white-space:nowrap}
.mselist .meta b{color:var(--crit);font-weight:700}
.mselempty{padding:12px 6px;font-size:var(--fs-sm);color:var(--muted)}
.mselfoot{border-top:1px solid var(--grid);margin-top:calc(7px*var(--d));
  padding-top:calc(7px*var(--d));font-size:var(--fs-xs);color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--wash2);
  border:1px solid var(--border);border-radius:var(--r-pill);padding:2px 4px 2px 10px;
  font-size:var(--fs-xs);font-weight:650;color:var(--ink)}
.chip button{background:none;border:none;color:var(--ink2);font-size:14px;line-height:1;
  padding:0 4px;border-radius:50%}
.chip button:hover{color:var(--crit);background:var(--wash)}


/* ---- settings page ---- */
.setwrap{display:flex;flex-direction:column;gap:calc(10px*var(--d))}
.setintro{font-size:var(--fs-sm);color:var(--ink2);max-width:78ch;margin:0 0 calc(4px*var(--d))}

/* ---- scoring model cards ---- */
.flagcard{display:grid;grid-template-columns:64px 1fr auto;gap:calc(12px*var(--d));
  align-items:start;background:var(--surface);border:var(--bw) solid var(--border);
  border-radius:var(--r);padding:calc(12px*var(--d)) calc(14px*var(--d));
  margin-bottom:calc(7px*var(--d));box-shadow:var(--shadow)}
.flagcard .code{font-size:calc(var(--fs)*1.15);font-weight:700;font-variant-numeric:tabular-nums;
  padding:calc(4px*var(--d)) 0;text-align:center;border-radius:var(--r-sm);
  background:var(--wash2);border:1px solid var(--border)}
.flagcard .nm{font-weight:700;font-size:var(--fs);margin-bottom:2px}
.flagcard .rule{font-size:var(--fs-sm);color:var(--ink);line-height:2}
.flagcard .rule input{width:62px;background:var(--page);border:1px solid var(--border);
  border-radius:var(--r-sm);padding:3px 6px;font-size:var(--fs-sm);font-weight:650;
  font-variant-numeric:tabular-nums;text-align:right}
.flagcard .rule .op{color:var(--muted)}
.flagcard .act{font-size:var(--fs-xs);color:var(--ink2);margin-top:5px}
.flagcard .act b{color:var(--ink)}
.flagcard .side{text-align:right;white-space:nowrap}
.flagcard .wlab{font-size:var(--fs-xs);letter-spacing:var(--tracking-label);
  text-transform:uppercase;color:var(--muted);font-weight:700}
.flagcard .side input{width:58px;background:var(--page);border:1px solid var(--border);
  border-radius:var(--r-sm);padding:calc(5px*var(--d)) 7px;font-size:var(--fs);font-weight:700;
  font-variant-numeric:tabular-nums;text-align:right;margin-top:3px}
.flagcard .hits{font-size:var(--fs-xs);color:var(--ink2);margin-top:6px;font-variant-numeric:tabular-nums}
.flagcard .hits b{color:var(--crit)}
.setblock{background:var(--surface);border:var(--bw) solid var(--border);border-radius:var(--r);
  padding:calc(13px*var(--d)) calc(15px*var(--d));box-shadow:var(--shadow)}
.setblock h4{margin:0 0 calc(9px*var(--d));font-size:var(--fs-h3);font-weight:700;color:var(--ink)}
.setrow{display:flex;align-items:center;gap:9px;flex-wrap:wrap;font-size:var(--fs-sm);
  padding:calc(5px*var(--d)) 0}
.setrow input{width:66px;background:var(--page);border:1px solid var(--border);
  border-radius:var(--r-sm);padding:4px 7px;font-size:var(--fs-sm);font-weight:650;
  font-variant-numeric:tabular-nums;text-align:right}
.setrow .grow{flex:1}
.setrow .out{font-variant-numeric:tabular-nums;color:var(--muted);font-size:var(--fs-xs)}
.livepv{display:flex;gap:calc(14px*var(--d));flex-wrap:wrap;padding:calc(10px*var(--d)) 0 0;
  margin-top:calc(8px*var(--d));border-top:1px solid var(--grid);font-size:var(--fs-sm)}
.livepv span b{font-variant-numeric:tabular-nums}
.setacts{display:flex;gap:7px;flex-wrap:wrap;margin-top:calc(10px*var(--d))}

/* ---- trends search made obvious ---- */
.mtctrl .searchwrap{display:flex;align-items:center;gap:6px;flex:1 1 240px;min-width:200px}
.mtctrl .searchwrap input{flex:1;min-width:150px}
.onerep{background:var(--surface);border:var(--bw) solid var(--border);
  border-left:var(--rail) solid var(--warn);border-radius:var(--r);
  padding:calc(11px*var(--d)) calc(14px*var(--d));margin-bottom:calc(10px*var(--d));
  font-size:var(--fs-sm);color:var(--ink2)}
.onerep b{color:var(--ink)}


/* ---- data strip: the single place files are managed ---- */
.data{background:var(--surface);border:var(--bw) solid var(--border);border-radius:var(--r);
  padding:calc(12px*var(--d)) calc(14px*var(--d));margin-bottom:calc(14px*var(--d));
  box-shadow:var(--shadow)}
.data.setup{border-left:var(--rail) solid var(--accent)}
.drow{display:flex;align-items:center;gap:calc(10px*var(--d));flex-wrap:wrap}
.dicon{font-size:19px;line-height:1;flex:none;opacity:.75}
.dmain{flex:1 1 320px;min-width:240px}
.dtitle{font-weight:700;font-size:var(--fs);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.dtitle .dot{width:8px;height:8px;border-radius:50%;flex:none}

<script>
"use strict";
/* ============================================================
   Chargeback Risk Console
   All analysis runs client-side. Report data never leaves this
   browser. The only network call the page ever makes is a fetch of
   its own version.json to see whether a newer build was deployed;
   it carries no data and is skipped entirely when opened from disk.

   FILE MAP
     1. THEME block (in <style> above)  — all visual tokens
     2. LAYOUT + COMPONENTS (in <style>) — written against tokens
     3. DESIGN SYSTEM (below)            — live theme editing
     4. MODEL + SCORING                  — verified; do not edit casually
     5. RENDERING                        — markup generation
     6. EXPORT                           — clipboard / CSV
     7. WIRING                           — event handlers
   ============================================================ */

/* ---------- build identity + update check ----------------------
   APP_VERSION is baked into this file. version.json sits next to it
   on the host and carries the same string. When they disagree, the
   host has a newer build than the tab you are looking at, and the
   banner offers a reload.

   Nothing is uploaded. The check is skipped when the page is opened
   from disk (file://) and fails silently when offline or when no
   version.json is present, so a local copy behaves exactly as before.

   TO RELEASE: bump APP_VERSION here, put the same string in
   version.json, upload both. Users are told within 15 minutes, or
   the moment they switch back to the tab.
   --------------------------------------------------------------- */
const APP_VERSION   = "2026.09.04";
const MODEL_VERSION = "m1.0";     // bump when scoring thresholds change
const UPDATE_CHECK_MS = 15*60*1000;

const UPDATE = (function(){
  let latest = null, shown = false;

  async function check(){
    if(location.protocol === "file:") return null;
    try{
      const r = await fetch("version.json?_=" + Date.now(), {cache:"no-store"});
      if(!r.ok) return null;
      const j = await r.json();
      if(!j || !j.version) return null;
      latest = String(j.version);
      if(latest !== APP_VERSION && !shown) show(j);
      return latest;
    }catch(e){ return null; }
  }

  function show(j){
    const bar = document.getElementById("updbar");
    const msg = document.getElementById("updmsg");
    if(!bar || !msg) return;
    msg.textContent =
      "Version " + latest + " is available — you are on " + APP_VERSION + ". "
      + (j.notes ? j.notes + " " : "")
      + "Reloading keeps your saved reports and your connected folder.";
    bar.classList.add("on");
    shown = true;
  }

  function start(){
    check();
    setInterval(check, UPDATE_CHECK_MS);
    document.addEventListener("visibilitychange", () => {
      if(!document.hidden) check();
    });
  }

  return {
    start, check,
    get latest(){ return latest; },
    reload(){
      const v = latest || String(Date.now());
      location.replace(location.pathname + "?v=" + encodeURIComponent(v) + location.hash);
    }
  };
})();

/* ---------- model (editable at runtime) ---------- */
const MODEL = {

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s==null?"":s).replace(/[&<>"']/g, c =>
  ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function toast(msg){
  const t=$("#toast"); t.textContent=msg; t.classList.add("on");
  clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove("on"), 1900);
