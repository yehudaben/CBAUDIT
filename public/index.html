      Δ compares only within ${nPeriods>1?"the current month":"the loaded month"} — never across a
      reset, which would read as a large improvement that never happened. Rep counts the reports
      inside that month. ${nrm
        ? "Per-day view divides each month-to-date total by the day of the month, so the line runs "
          + "straight through the reset; CB % is already a rate and is unchanged by it."
        : "Month-to-date view cuts each sparkline at the reset."}

      or falling volume.${all.length>shown.length
      ? ` Only the first ${shown.length} rows are drawn to keep the page responsive; the Copy buttons
        export all ${all.length}.` : ""}</p>

}

/* ---------- drill-down detail, works at every level ---------- */
function detailCardHTML(){
  if(!MT.sel) return "";
  const H = historyAt(MT.sel.level);
  const rec = H.rows.find(r=>r.key===MT.sel.key);
  if(!rec) return `<div class="mcard"><p class="note">That row is not in the current library.</p></div>`;
  const pts = rec.pts, stamps = H.stamps;
  const last = rec.last, prev = (()=>{ const s=pts.filter(Boolean); return s.length>1?s[s.length-2]:null; })();
  const isMid = rec.level==="mid";
  const head = isMid
    ? `<span class="nm">${esc(rec.m)}</span><span class="dba">— ${esc(rec.d)}</span>
       <span class="mid">${esc(rec.id)}</span><span class="badge">${esc(rec.b)}</span>`
    : `<span class="nm">${esc(rec.key)}</span>
       <span class="dba">— ${last.nmids} MID${last.nmids===1?"":"s"}, ${last.flagged} flagged,
       ${last.over} over ceiling</span>`;
  const cards = [
    {lab:"CB %", now:last.cbp==null?"no sales":last.cbp.toFixed(2)+"%",
     cur:last.cbp, pv:prev?prev.cbp:null, vals:pts.map(p=>p?p.cbp:null), thr:MODEL.f5Cbp, inv:false},
    {lab:"Chargebacks", now:fmtN(last.cb), cur:last.cb, pv:prev?prev.cb:null,
     vals:pts.map(p=>p?p.cb:null), inv:false},
    {lab:"Transaction volume", now:fmtN(last.s), cur:last.s, pv:prev?prev.s:null,
     vals:pts.map(p=>p?p.s:null), inv:true},
    isMid
      ? {lab:"Refund %", now:last.rfp==null?"n/a":last.rfp.toFixed(1)+"%", cur:last.rfp,
         pv:prev?prev.rfp:null, vals:pts.map(p=>p?p.rfp:null), inv:true}
      : {lab:"MIDs over ceiling", now:String(last.over), cur:last.over,
         pv:prev?prev.over:null, vals:pts.map(p=>p?p.over:null), inv:false}
  ];
  return `<div class="mcard" id="detail">
    <div class="mhead">${head}
      <button class="close" id="btnCopyDetail" style="margin-left:auto">Copy history</button>
      <button class="close" id="mClose">Close</button></div>
    <div class="sparks">${cards.map(c=>`<div class="spark">
      <div class="lab">${esc(c.lab)}</div><div class="now">${c.now}</div>
      ${deltaTag(c.cur, c.pv, c.inv)}
      ${sparkSVG(c.vals,{threshold:c.thr, color:"var(--accent)"})}</div>`).join("")}</div>
    <div class="scroll"><table><thead><tr>
      <th class="na">Report</th>${isMid?'<th class="n na">Weighted</th><th class="na">Tier</th>'
        :'<th class="n na">MIDs</th><th class="n na">Flagged</th><th class="n na">Over ceiling</th>'}
      <th class="n na"># Sales</th><th class="n na">$ Sales</th><th class="n na">CB #</th>
      <th class="n na">CB Volume</th><th class="n na">CB %</th>${isMid?'<th class="n na">Refund %</th>':""}
      </tr></thead><tbody>
      ${pts.map((p,i)=>({p,i})).filter(x=>x.p).reverse().map(({p,i})=>{
        const n=niceStamp(stamps[i]);
        return `<tr><td>${n?esc(n.full):esc(String(stamps[i]))}</td>
          ${isMid?`<td class="n"><strong>${p.w}</strong></td><td>${p.tier}</td>`
            :`<td class="n">${p.nmids}</td><td class="n">${p.flagged}</td>
              <td class="n"><strong>${p.over}</strong></td>`}
          <td class="n">${fmtN(p.s)}</td><td class="n">${fmtM(p.ds,0)}</td>
          <td class="n">${p.cb}</td><td class="n">${fmtM(p.cv,0)}</td>
          <td class="n">${p.cbp==null?"no sales":p.cbp.toFixed(2)+"%"}</td>
          ${isMid?`<td class="n">${fmtP(p.rfp)}</td>`:""}</tr>`;
      }).join("")}
    </tbody></table></div>
    <p class="note">${pts.filter(Boolean).length} of ${stamps.length} reports contain this row.
      ${isMid?"":"Group figures are pooled totals, so CB % is total chargebacks over total sales."}

  </div>`;
}

const FLAG_INFO = {
  F5:{name:"Realized damage", w:"w.F5",
      action:"Immediate review; consider reserve or volume cap."},
  F1:{name:"Visa disputes not being deflected", w:"w.F1",
      action:"Enable RDR or raise the RDR ceiling. The most fixable flag."},
  F3:{name:"Mastercard disputes with thin refunds", w:"w.F3",
      action:"Ethoca alerts, refund-policy review, descriptor and fulfilment check."},
  F4:{name:"Uncovered Amex / Discover losses", w:"w.F4",
      action:"Merchant-side remediation only — RDR does not reach these brands."},
  F2:{name:"RDR switched off entirely", w:"w.F2",
      action:"Enable RDR immediately."}
};
function numIn(path, val, step, width){
  return `<input type="number" data-m="${path}" value="${val}" step="${step||1}"

}
function flagRuleHTML(code){
  const M=MODEL;
  switch(code){
    case "F5": return `CB % above ${numIn("f5Cbp",M.f5Cbp,0.1)} <span class="op">%</span>

      <span class="op">%</span>`;

      <div class="setrow">CB % above ${numIn("bonMid",M.bonMid,0.5)} <span class="op">%</span>
        adds ${numIn("bonMidPts",M.bonMidPts,1)} points</div>
      <div class="setrow"><span class="out">Anything lower adds nothing, and a row above 100% CB gets

      <div class="setrow"><span class="out">The default of 250 is where the model's own numbers meet:

/* ============================================================
   MONTH OVER MONTH — current month-to-date against the prior
   month's FINAL figures, which is the last report filed before the
   counters were zeroed.

   Counts are not like-for-like: a part-finished month is being held
   up against a complete one. Rates are, so CB % leads and the counts
   sit beside it clearly marked.
   ============================================================ */
function momHTML(H, shown, isMid){
  const rows = shown.filter(r=>r.prev && r.last);
  if(!rows.length) return "";
  const curP  = rows[0].period, prevP = rows[0].prevPeriod;
  const day   = rows[0].last.day;
  const dim   = daysInMonth(curP);
  const pct   = (day && dim) ? Math.round(day/dim*100) : null;

  const body = rows.map(r=>{
    const a=r.prev, b=r.last;
    const dcbp = (a.cbp!=null && b.cbp!=null) ? b.cbp-a.cbp : null;
    const who = isMid
      ? `<span class="nm">${esc(r.m)}</span><br><span class="dba">${esc(r.d)}</span>`
      : `<span class="nm">${esc(r.key)}</span>`;
    return `<tr>
      <td class="who">${who}</td>
      <td class="n">${a.cbp==null?"—":a.cbp.toFixed(2)+"%"}</td>
      <td class="n">${b.cbp==null?"—":b.cbp.toFixed(2)+"%"}</td>
      <td class="n">${dNum(dcbp,2,false,false)}</td>
      <td class="n">${fmtN(a.cb)}</td>
      <td class="n">${fmtN(b.cb)}</td>
      <td class="n">${fmtN(a.s)}</td>
      <td class="n">${fmtN(b.s)}</td>
    </tr>`;
  }).join("");

  return `<h2 id="s-mom">Versus last month
      <span class="n">${periodLabel(curP)} so far vs ${periodLabel(prevP)} final</span>
      <button class="cp" data-copy="mom">Copy</button></h2>
    <p class="lede">Each row's current month-to-date figures against the last report filed in
      ${esc(periodLabel(prevP))} — that month's finished totals.
      <strong>Read the CB % columns, not the counts.</strong>
      ${pct!=null?`${periodLabel(curP)} is about ${pct}% elapsed (day ${day} of ${dim}), so its
      counts are naturally lower and a fall in CB # means nothing on its own.`
      :"The current month is incomplete, so its counts are naturally lower."}
      A rate that is up on last month's finished rate is a real deterioration.</p>
    <div class="scroll"><table><thead><tr>
      <th class="na">${isMid?"MID":MT.level==="merch"?"Merchant":"Bucket"}</th>
      <th class="n na">CB % ${esc(periodLabel(prevP))} final</th>
      <th class="n na">CB % now</th><th class="n na">Δ rate</th>
      <th class="n na">CB # final</th><th class="n na">CB # now</th>
      <th class="n na">Sales final</th><th class="n na">Sales now</th>
    </tr></thead><tbody>${body}</tbody></table></div>
    <p class="note">Only rows present in both months appear here. A merchant that started this month
      has no prior final to compare against.</p>`;
}

/* ============================================================
   TRACKER PAGE — Board is the worklist, Outcomes is the follow-up audit.
   Neither reads or writes MODEL; both read the active report only to show
   the current value of whichever metric the action is judged by.
   ============================================================ */
const VERDICT = {
  improved:{t:"improved",       c:"v-ok"},
  worse:   {t:"worse",          c:"v-no"},
  flat:    {t:"no change",      c:"v-fl"},
  "too-early":{t:"too early",   c:"v-wt"},
  thin:    {t:"not enough sales yet", c:"v-wt"},
  "no-report-since":{t:"no report since the fix", c:"v-wt"},
  missing: {t:"not in this report",   c:"v-wt"},
  "no-baseline":{t:"no baseline captured", c:"v-wt"},
  "not-available":{t:"not available", c:"v-wt"},
  "not-done":{t:"not done yet",  c:"v-fl"}
};
function trkMetric(v, dp){
  return v==null ? "not available" : Number(v).toFixed(dp)+"%";
}
function actionSelect(mid, cur){
  return `<select class="trkact" data-action-for="${esc(mid)}">${
    TRACK_ACTION_NAMES.map(n=>`<option value="${esc(n)}"${n===cur?" selected":""}>${esc(n)}</option>`)
    .join("")}</select>`;
}
function statusBtns(mid, cur){
  return `<span class="trkst">${TRACK_STATUS.map(st=>
    `<button class="${st===cur?"on":""}" data-status-for="${esc(mid)}" data-status="${st}"
       >${esc(TRACK_LABEL[st])}</button>`).join("")}</span>`;
}
function trackerRowHTML(t, A){
  const e = A && A.byMid ? A.byMid[t.mid] : null;
  const spec = TRACK_ACTIONS[t.action] || TRACK_ACTIONS["Watch"];
  const now = e ? e[spec.metric] : null;
  return `<div class="trow">
    <div class="tmain">
      <span class="nm">${esc(e?e.m:t.mid)}</span>
      ${e?`<span class="dba">— ${esc(e.d)}</span>`:`<span class="dba">— not in this report</span>`}
      <span class="mid">${esc(t.mid)}</span>
      ${e&&e.b?`<span class="bkt">${esc(e.b)}</span>`:""}
      ${e?`<span class="pill">${esc(tierOf(e))}</span>`:""}
    </div>
    <div class="tmeta">
      ${actionSelect(t.mid, t.action)}
      <span class="cur">${esc(spec.label)} now <b>${trkMetric(now, spec.dp)}</b></span>
      ${statusBtns(t.mid, t.status)}
      <button class="trkx" data-untrack="${esc(t.mid)}" title="Stop tracking">Remove</button>
    </div>
  </div>`;
}
function outcomeRowHTML(o, A){
  const e = A && A.byMid ? A.byMid[o.mid] : null;
  const v = VERDICT[o.verdict] || {t:o.verdict, c:"v-fl"};
  const showN = ["improved","worse","flat"].indexOf(o.verdict)>=0;
  let detail;
  if(showN){
    const d = o.now - o.base;
    detail = `<b>${trkMetric(o.base,o.dp)}</b> → <b>${trkMetric(o.now,o.dp)}</b>
      <span class="dlt">${d>0?"+":""}${d.toFixed(o.dp)} pts</span>`;
  } else if(o.verdict==="thin"){
    detail = `${fmtN(o.sales)} of ${fmtN(o.thinFloor)} sales — too small a denominator to read`;
  } else if(o.verdict==="too-early"){
    detail = `${o.elapsedDays} of ${TRACKER.lagDays} days since the fix`;
  } else if(o.verdict==="no-report-since"){
    detail = `newest report is ${esc(o.reportStamp||"undated")}, the fix came after it`;
  } else if(o.verdict==="missing"){
    detail = `this MID is not in the active report`;
  } else {
    detail = `baseline ${trkMetric(o.base,o.dp)}`;
  }
  return `<div class="orow">
    <div class="tmain">
      <span class="nm">${esc(e?e.m:o.mid)}</span>
      ${e?`<span class="dba">— ${esc(e.d)}</span>`:""}
      <span class="mid">${esc(o.mid)}</span>
      ${e&&e.b?`<span class="bkt">${esc(e.b)}</span>`:""}
      <span class="vd ${v.c}">${esc(v.t)}</span>
    </div>
    <div class="tmeta">
      <span class="ac">${esc(o.action)}</span>
      <span class="cur">${esc(o.metricLabel)} · ${detail}</span>
      ${o.status==="done"
        ? `<button class="trkc" data-status-for="${esc(o.mid)}" data-status="closed">Close</button>`
        : `<button class="trkc" data-status-for="${esc(o.mid)}" data-status="done">Reopen</button>`}
    </div>
  </div>`;
}
function trackerPageHTML(A){
  const c = TRACKER.counts();
  const open = c.required + c.doing;
  const tab = VIEW.trackTab==="outcomes" ? "outcomes" : "board";
  const P=[];
  P.push(`<div class="trkhead">
    <div class="trktabs">
      <button data-trktab="board" class="${tab==="board"?"on":""}">Board
        <span class="c">${open}</span></button>
      <button data-trktab="outcomes" class="${tab==="outcomes"?"on":""}">Outcomes
        <span class="c">${c.done+c.closed}</span></button>
    </div>
    <span class="sp"></span>
    <button class="btn" id="btnTrkSync">${FOLDER.state==="connected"?"Sync with team":"Connect a folder"}</button>
    <button class="btn" id="btnTrkCopy">Copy</button>
    <button class="btn" id="btnTrkCsv">Download CSV</button>
  </div>`);

  /* the folder-status paragraph was removed in 2026.09.04; the tab context
     line already says whether this is shared or browser-only */
  if(TRACKER.err) P.push(`<p class="note"><b>Tracker sync problem:</b> ${esc(TRACKER.err)}</p>`);

  if(tab==="board"){
    if(!TRACKER.list().length){
      P.push(`<div class="empty">Nothing tracked yet. Press <b>+</b> beside any merchant on the
        Audit tab to put it on the board.</div>`);
      return P.join("");
    }
    ["required","doing","done"].forEach(st=>{
      const rows = TRACKER.byStatus(st);
      P.push(`<h2><span class="badge"><span class="dot ${st==="required"?"d-c":st==="doing"?"d-h":"d-m"}"></span>
        ${esc(TRACK_LABEL[st])}</span><span class="n">${rows.length} MID${rows.length===1?"":"s"}</span></h2>`);
      if(!rows.length){ P.push(`<p class="note">None.</p>`); return; }
      /* grouped by action, so four MIDs needing the same operation read as one job */
      const byAct={}; rows.forEach(r=>(byAct[r.action]||(byAct[r.action]=[])).push(r));
      Object.keys(byAct).sort().forEach(act=>{
        P.push(`<div class="agrp"><div class="ahd">${esc(act)}
          <span class="n">${byAct[act].length}</span></div>
          ${byAct[act].map(t=>trackerRowHTML(t,A)).join("")}</div>`);
      });
    });
    const closed = TRACKER.byStatus("closed");
    if(closed.length) P.push(`<p class="note">${closed.length} closed —
      see the Outcomes tab.</p>`);
    return P.join("");
  }

  /* ---- outcomes ---- */
  const outs = TRACKER.list().filter(r=>r.status==="done"||r.status==="closed")
                 .map(r=>TRACKER.outcome(r.mid));
  P.push(`<p class="lede">Every fix marked done, measured against the numbers captured at the time.
    Each action is judged by the rate that would move if it worked — never a count, because the portal
    zeroes every counter on the 1st and a count would read the reset as a success.</p>`);
  if(!outs.length){
    P.push(`<div class="empty">No fixes marked done yet. Move a row to
      <b>Action done</b> on the Board and its baseline is captured automatically.</div>`);
    return P.join("");
  }
  const tally={};
  outs.forEach(o=>tally[o.verdict]=(tally[o.verdict]||0)+1);
  P.push(`<div class="tiles">${["improved","flat","worse"].map(k=>
    `<div class="tile${k==="improved"?" g":k==="worse"?" c":""}"><div class="lab">${esc(VERDICT[k].t)}</div>
      <div class="val">${tally[k]||0}</div></div>`).join("")}
    <div class="tile"><div class="lab">waiting</div><div class="val">${
      outs.length - (tally.improved||0) - (tally.flat||0) - (tally.worse||0)}</div>
      <div class="sub">lag, thin or no report yet</div></div>
  </div>`);
  const order = ["worse","flat","improved","thin","too-early","no-report-since","missing",
                 "no-baseline","not-available","not-done"];
  outs.sort((a,b)=>order.indexOf(a.verdict)-order.indexOf(b.verdict));
  P.push(outs.map(o=>outcomeRowHTML(o,A)).join(""));
  P.push(`<p class="note">A verdict appears only once the fix has had
    <b>${TRACKER.lagDays} days</b> and the MID clears <b>${fmtN(MODEL.thinSales)} sales</b>.
    The lag is a setting, not a measured figure — change it in Settings.</p>`);
  return P.join("");
}

/* ============================================================
   PORTFOLIO TREND — one row per saved report, so a folder of
   exports reads as a time series rather than a pile of files.
   Separate small multiples, never a dual-axis chart.
   ============================================================ */
function portfolioSeries(){
  return allSnapshotsChrono().map(s=>{
    const A = analyse({name:s.name, stamp:s.stamp, rows:unpackRows(s.rows)});
    return {snap:s, A};
  });
}
function portfolioTrendHTML(){
  if(LIB.length<1) return "";
  const ser = portfolioSeries();
  const last = ser[ser.length-1], prev = ser.length>1 ? ser[ser.length-2] : null;
  /* the counters were zeroed between any two reports in different months, so a
     delta across that boundary is the reset, not a change in behaviour */
  const sp   = ser.map(x=>periodOf(x.snap.stamp));
  const brk  = {}; sp.forEach((p,i)=>{ if(i>0 && p && sp[i-1] && p!==sp[i-1]) brk[i]=1; });
  const nPer = [...new Set(sp.filter(Boolean))].length;
  const sameMonth = !!(prev && sp[ser.length-1] && sp[ser.length-1]===sp[ser.length-2]);
  const met = [
    {lab:"Act today", get:x=>x.A.crit.length, dp:0},
    {lab:"Flagged", get:x=>x.A.ranked.length+x.A.quar.length, dp:0},
    {lab:"Total chargebacks", get:x=>x.A.E.reduce((a,e)=>a+e.cb,0), dp:0},
    {lab:"Integrity flags", get:x=>x.A.integ.length, dp:0},
    {lab:"Portfolio CB %", get:x=>{
      const s=x.A.E.reduce((a,e)=>a+e.s,0), c=x.A.E.reduce((a,e)=>a+e.cb,0);
      return s>0 ? c/s*100 : null;}, dp:3}
  ];
  const cards = met.map(m=>{
    const vals = ser.map(m.get);
    const cur = m.get(last), pv = prev ? m.get(prev) : null;
    const shown = cur==null ? "n/a"
      : (m.dp ? cur.toFixed(m.dp)+"%" : Number(cur).toLocaleString("en-US"));
    return `<div class="spark"><div class="lab">${esc(m.lab)}</div>
      <div class="now">${shown}</div>${sameMonth
        ? deltaTag(cur,pv,false)
        : `<span class="dlt flat" title="The previous report is from another month, and the portal zeroed every counter in between">new month</span>`}
      ${sparkSVG(vals,{breaks:brk})}</div>`;
  }).join("");
  return `<h2 id="s-trend">Portfolio trend
      <span class="n">${ser.length} report${ser.length===1?"":"s"}</span>
      <button class="cp" data-copy="trend">Copy</button></h2>
    ${ser.length<2 ? `<p class="lede">Load more reports — or connect a folder of them —
      and these fill in.</p>` : ""}
    <div class="trend">${cards}</div>
    <div class="scroll"><table><thead><tr>
      <th class="na">Report</th><th class="na">Month</th><th class="n na">MIDs</th><th class="n na">Act today</th>
      <th class="n na">High</th><th class="n na">Monitor</th><th class="n na">Integrity</th>
      <th class="n na">Flagged</th><th class="n na">CB total</th><th class="n na">Portfolio CB %</th>
      </tr></thead><tbody>
      ${ser.slice().reverse().map(x=>{
        const n=niceStamp(x.snap.stamp);
        const tot=x.A.E.reduce((a,e)=>a+e.s,0), cb=x.A.E.reduce((a,e)=>a+e.cb,0);
        return `<tr><td>${n?esc(n.full):esc(x.snap.name)}</td>
          <td>${esc(periodLabel(periodOf(x.snap.stamp)))}</td>
          <td class="n">${x.A.total}</td>
          <td class="n"><strong>${x.A.crit.length}</strong></td>
          <td class="n">${x.A.high.length}</td><td class="n">${x.A.mon.length}</td>
          <td class="n">${x.A.integ.length}</td>
          <td class="n">${x.A.ranked.length+x.A.quar.length}</td>
          <td class="n">${cb.toLocaleString("en-US")}</td>
          <td class="n">${tot>0?(cb/tot*100).toFixed(3)+"%":"n/a"}</td></tr>`;
      }).join("")}
    </tbody></table></div>
    `;
}

function wireNav(){

  nav.querySelectorAll("a[data-nav]").forEach(a=>{

      e.preventDefault();
      const t=document.getElementById(a.getAttribute("data-nav"));

    };

  const ids=[...nav.querySelectorAll("a[data-nav]")].map(a=>a.getAttribute("data-nav"));

        if(a) a.classList.add("on");

  },{rootMargin:"-60px 0px -70% 0px"});
  ids.forEach(id=>{const el=document.getElementById(id); if(el) obs.observe(el);});
}

const SORTABLE = [
  {k:"m",   t:"Merchant"}, {k:"d", t:"DBA"}, {k:"b", t:"Bucket"},
  {k:"w",   t:"Wgt", n:1}, {k:"cb", t:"CB #", n:1}, {k:"cbp", t:"CB %", n:1},
  {k:"rfp", t:"Rfnd %", n:1}, {k:"vi", t:"Visa", n:1}, {k:"rn", t:"RDR", n:1}
];
function sortRows(rows){
  const {key,dir}=VIEW.sort;
  return rows.slice().sort((a,b)=>{
    let x=a[key], y=b[key];
    if(x===null||x===undefined)x=-Infinity; if(y===null||y===undefined)y=-Infinity;
    if(typeof x==="string") return dir*x.localeCompare(y);
    return dir*(x-y) || (b.cb-a.cb);
  });
}
function thHTML(){
  return SORTABLE.map(c=>{
    const on = VIEW.sort.key===c.k;
    const ar = on ? (VIEW.sort.dir<0?"▼":"▲") : "";
    return `<th class="${c.n?"n":""}" data-sort="${c.k}">${c.t} <span class="ar">${ar}</span></th>`;
  }).join("");
}

  const V = verify(A);
  window.__A = A; window.__B = B;   // for export + tests

  const fCrit = A.crit.filter(passFilter), fHigh = A.high.filter(passFilter),
        fMon  = A.mon.filter(passFilter),  fInteg = A.integ.filter(passFilter),

  const filtering = !!VIEW.buckets || VIEW.q || VIEW.tier!=="__all";
  const P=[]; const add=s=>P.push(s);

  /* tiles — the headline summary that sat above these was removed in
     2026.09.03; every figure it recited is in the tiles or the tab context */

    <select id="selTier">

    <span class="sp"></span>

  add(fMon.length ? `<ul class="flat">${sortRows(fMon).map(e=>`<li>

  const iCb=A.integ.reduce((a,e)=>a+e.cb,0), iCv=A.integ.reduce((a,e)=>a+e.cv,0),
        iDr=A.integ.reduce((a,e)=>a+e.dr,0);
  const iByB={}; A.integ.forEach(e=>iByB[e.b]=(iByB[e.b]||0)+1);

  add(`<div class="scroll"><table><thead><tr>

  finishRender(P, A, V);
}

  return `<h2 id="s-buckets">Where the chargebacks sit<span class="n">by bucket · CB count</span>
    <button class="cp" data-copy="buckets">Copy</button></h2>
  <p class="lede">Buckets with 10 or more chargebacks. Bars in red have <strong>RDR = 0 across every MID
    in the bucket</strong> while Visa disputes are posting — a configuration state, not merchant behaviour.</p>
  <div class="chart">
    <div class="lgnd"><span><i style="background:var(--bar)"></i>RDR configured</span>
      <span><i style="background:var(--crit)"></i>◆ RDR = 0 bucket-wide</span></div>
    ${shown.map(b=>{
      const z = b.rn===0 && b.vi>0;
      return `<div class="brow" title="${esc(b.name)} — ${b.cb} CBs, ${b.n} MIDs, ${b.fl} flagged, RDR ${b.rn}">
        <div class="bl">${esc(b.name)}${z?' <span class="zm">◆</span>':""}</div>
        <div class="btrack"><div class="bfill${z?" z":""}" style="width:${Math.max(b.cb/max*100,1.2).toFixed(1)}%"></div></div>
        <div class="bv">${b.cb}</div></div>`;

    <p class="note">Hover a bar for MID count, flagged count and RDR total.</p>

  <div class="scroll"><table><thead><tr><th class="na">Bucket</th><th class="n na">MIDs</th>

    <th class="n na">RDR #</th><th class="n na">Visa</th><th class="n na">MC</th>

    ${A.buckets.map(b=>{

}

function renderPatterns(A){
  const out=['<h2 id="s-pat">Pattern callouts</h2>'];
  const zeroB = A.buckets.filter(b=>b.rn===0 && b.vi>0).sort((a,b)=>b.vi-a.vi);
  if(zeroB.length){
    const top=zeroB[0];
    const critIn = A.crit.filter(e=>e.b===top.name).length;
    out.push(`<div class="callout"><div class="ttl">1 · Entire bucket with RDR = 0 — ${esc(top.name)}</div>
      <p>All <strong>${top.n} MIDs</strong> in this bucket have RDR # = 0, yet it carries
      <strong>${top.vi} Visa chargebacks</strong> and ${top.cb} total. <strong>${top.fl} of ${top.n}</strong>
      MIDs are flagged${critIn?`, including ${critIn} of the ${A.crit.length} rows in the act-today tier`:""}.
      One configuration problem, not ${top.fl} merchant problems — enabling RDR at the bucket level is the
      highest-leverage action available.
      ${zeroB.length>1?`Other buckets with RDR = 0 alongside Visa activity, at lower volume: `
        + zeroB.slice(1).map(b=>`${esc(b.name)} (${b.vi} Visa CB)`).join(", ")+"." : ""}</p></div>`);
  } else {
    out.push(`<div class="callout na"><div class="ttl">1 · Entire bucket with RDR = 0 — none found</div>
      <p>No bucket has RDR switched off across all its MIDs while Visa disputes are posting.</p></div>`);
  }
  const m3 = A.multi.filter(x=>x.rows.length>=3);
  if(m3.length){
    out.push(`<div class="callout"><div class="ttl">2 · Merchants with 3+ flagged MIDs</div>
      <p>${m3.map(x=>`<strong>${esc(x.m)}</strong> — ${x.rows.length} flagged MIDs (`
        + x.rows.slice().sort((a,b)=>b.w-a.w).map(e=>`${esc(e.d)} w${e.w}`).join(", ")+")").join("<br>")}
      <br>Handle these at the merchant level rather than chasing individual MIDs.
      ${A.multi.filter(x=>x.rows.length===2).length?`Merchants with exactly 2 flagged MIDs, worth watching
      for the same pattern: `+A.multi.filter(x=>x.rows.length===2).map(x=>esc(x.m)).join(", ")+".":""}</p></div>`);
  } else {
    out.push(`<div class="callout na"><div class="ttl">2 · Merchants with 3+ flagged MIDs — none</div>
      <p>No single merchant has three or more flagged MIDs in this export.</p></div>`);
  }
  const iCb=A.integ.reduce((a,e)=>a+e.cb,0), iCv=A.integ.reduce((a,e)=>a+e.cv,0);
  const iByB={}; A.integ.forEach(e=>iByB[e.b]=(iByB[e.b]||0)+1);
  const topB=Object.keys(iByB).sort((a,b)=>iByB[b]-iByB[a]).slice(0,2);
  out.push(`<div class="callout"><div class="ttl">3 · Chargebacks posting against zero sales — ${A.integ.length} MIDs</div>
    <p><strong>${iCb} chargebacks</strong> and <strong>${fmtM(iCv)}</strong> of dispute volume on MIDs with
    no sales${topB.length?`, concentrated in ${topB.map(k=>`<strong>${esc(k)}</strong> (${iByB[k]})`).join(" and ")}`:""}.
    Because CB % is undefined these score zero and never reach the action tiers — the framework
    structurally cannot rank them. ${A.integ.length?`Largest: ${A.integ.slice(0,3)
      .map(e=>`${esc(e.d)} (${e.cb} CBs, ${fmtM(e.cv)})`).join(", ")}.`:""}</p></div>`);
  if(A.quar.length){
    out.push(`<div class="callout cr"><div class="ttl">4 · CB % above 100% — ${A.quar.length} MID${A.quar.length>1?"s":""}</div>
      <p>${A.quar.map(e=>`<strong>${esc(e.m)}</strong> (${esc(e.id)}) at
        <strong>${e.cbp.toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2})}%</strong>
        — ${e.cb} chargebacks against ${fmtN(e.s)} sale${e.s===1?"":"s"}, with ${fmtM(e.dr)} of refunds on
        ${fmtM(e.ds)} of sales`).join("<br>")}. Verify before acting — held in quarantine rather than
        ranked among real damage.</p></div>`);
  } else {
    out.push(`<div class="callout na"><div class="ttl">4 · CB % above 100% — none</div>
      <p>No MID reports more chargebacks than it could support from its sales count.</p></div>`);
  }
  out.push(`<div class="callout na"><div class="ttl">5 · MIDs first appearing in the last 3 days</div>
    <p>Needs a running history rather than a pairwise comparison. With two exports loaded, the
    <em>New to the list</em> block above is the closest equivalent.</p></div>`);
  return out.join("");
}



/* ============================================================
   EXPORT — column order, formatting and group separators are
   defined once here and drive the clipboard, the CSV download and
   the on-screen preview, so all three always agree.

   sep:true marks a column after which a thick rule is drawn.
   money / pct columns carry their $ and % in the value itself, so
   Google Sheets receives them already formatted.
   ============================================================ */
const EXPORT_COLS = [
  {h:"Tier",            k:"tier"},
  {h:"Flags",           k:"flags"},
  {h:"Primary",         k:"primary"},
  {h:"Action",          k:"action",  sep:true},
  {h:"Bucket",          k:"b"},
  {h:"Merchant",        k:"m"},
  {h:"DBA",             k:"d"},
  {h:"MID",             k:"id",      mono:true, text:true},
  {h:"# Sales",         k:"s",       int:true},
  {h:"$ Sales",         k:"ds",      money:true, sep:true},
  {h:"CB #",            k:"cb",      int:true},
  {h:"CB Volume",       k:"cv",      money:true},
  {h:"CB %",            k:"cbp",     pct:2, sep:true},
  {h:"$ Refunds",       k:"dr",      money:true},
  {h:"Refund %",        k:"rfp",     pct:1},
  {h:"MC",              k:"mc",      int:true, sep:true},
  {h:"Visa",            k:"vi",      int:true},
  {h:"# RDR",           k:"rn",      int:true},
  {h:"RDR Coverage %",  k:"cov",     pct:1, sep:true},
  {h:"Amex",            k:"ax",      int:true},
  {h:"Disc",            k:"dc",      int:true}
];

const money2 = v => v==null ? "" :
  "$" + Number(v).toLocaleString("en-US",{minimumFractionDigits:2, maximumFractionDigits:2});
const pctN = (v,d) => v==null ? "" :
  Number(v).toLocaleString("en-US",{minimumFractionDigits:d, maximumFractionDigits:d}) + "%";
const intN = v => v==null ? "" : Number(v).toLocaleString("en-US");

/* one formatted cell, used by every export path */
function cellFor(e, col){
  const v = e[col.k];
  if(col.money) return money2(v);
  if(col.pct){
    if(col.k==="cbp" && e.zs) return "no sales";
    return v==null ? "" : pctN(v, col.pct);
  }
  if(col.int) return intN(v);
  return v==null ? "" : String(v);
}
function decorate(e){
  return Object.assign({}, e, {
    tier: tierOf(e),
    flags: e.F.join("+") || "—",
    primary: PRIMARY_LABEL[e.pri] || "",
    action: actionFor(e)
  });
}
function exportRow(e){
  const d = decorate(e);
  return EXPORT_COLS.map(c => cellFor(d, c).replace(/[\t\r\n]/g," "));
}

function exportSet(which){
  const A=window.__A;
  if(!A) return {head:[],rows:[],label:"",cols:EXPORT_COLS};
  const pick = {
    crit:["Act today", A.crit], high:["High", A.high], mon:["Monitor", A.mon],
    integ:["Data integrity", A.integ], quar:["Quarantine", A.quar],
    all:["Full audit", A.ranked.concat(A.quar).concat(A.integ)]
  }[which];

  if(which==="buckets"){
    return {label:"Buckets", cols:null,
      head:["Bucket","MIDs","Flagged","Zero-sale","# Sales","$ Sales","$ Refunds","CB #",
            "# RDR","Visa","MC","Amex","Disc","RDR=0 bucket-wide"],
      rows:A.buckets.map(b=>[b.name,intN(b.n),intN(b.fl),intN(b.zs),intN(b.s),
        money2(b.ds),money2(b.dr),intN(b.cb),intN(b.rn),intN(b.vi),intN(b.mc),
        intN(b.ax),intN(b.dc),(b.rn===0&&b.vi>0)?"YES":""]), sepAfter:[]};
  }
  if(which==="mom"){
    const {shown} = mtRows();
    const rows = shown.filter(r=>r.prev && r.last);
    const curP = rows.length?rows[0].period:null, prevP = rows.length?rows[0].prevPeriod:null;
    return {label:"Versus last month", cols:null, sepAfter:[],
      head:[MT.level==="bucket"?"Bucket":MT.level==="merch"?"Merchant":"MID",
            "Merchant","DBA","Bucket",
            "CB % "+periodLabel(prevP)+" final","CB % "+periodLabel(curP)+" to date",
            "\u0394 CB % (pp)",
            "CB # final","CB # to date","Sales final","Sales to date",
            "$ Sales final","$ Sales to date"],
      rows:rows.map(r=>{
        const a=r.prev, b=r.last;
        const d=(a.cbp!=null&&b.cbp!=null)?b.cbp-a.cbp:null;
        return [r.level==="mid"?r.id:r.key, r.m, r.d, r.b,
          a.cbp==null?"no sales":pctN(a.cbp,2),
          b.cbp==null?"no sales":pctN(b.cbp,2),
          d==null?"":(d>0?"+":"")+d.toFixed(2),
          intN(a.cb), intN(b.cb), intN(a.s), intN(b.s),
          money2(a.ds), money2(b.ds)];
      })};
  }
  if(which==="midtrend"){
    const {all} = mtRows();
    return {label:"MID trends", cols:null, sepAfter:[],
      head:[MT.level==="bucket"?"Bucket":MT.level==="merch"?"Merchant":"MID",
            "Merchant","DBA","Bucket","Month","Reports in month","Status",
            "First in month","Latest report",
            "Volume first","Volume last","Δ Volume",
            "CB # first","CB # last","Δ CB #",
            "CB % first","CB % last","Δ CB % (pp)",
            "Weighted last","Tier last"],
      rows:all.map(r=>{
        const H=historyAt(MT.level);
        /* first/last of the CURRENT MONTH, matching the values printed below —
           the overall first would date a July row against an August figure */
        let fi=-1, li=-1;
        r.pts.forEach((p,i)=>{
          if(p && (!r.period || p.period===r.period)){ if(fi<0) fi=i; li=i; }
        });
        if(fi<0){ fi=r.pts.findIndex(Boolean); r.pts.forEach((p,i)=>{ if(p) li=i; }); }
        const nf=niceStamp(H.stamps[fi]), nl=niceStamp(H.stamps[li]);
        return [r.level==="mid"?r.id:r.key, r.m, r.d, r.b, periodLabel(r.period), String(r.n), r.status[0],
          nf?nf.full:String(H.stamps[fi]), nl?nl.full:String(H.stamps[li]),
          intN(r.first.s), intN(r.last.s), (r.dsal>0?"+":"")+intN(r.dsal),
          intN(r.first.cb), intN(r.last.cb), (r.dcb>0?"+":"")+intN(r.dcb),
          r.first.cbp==null?"no sales":pctN(r.first.cbp,2),
          r.last.cbp==null?"no sales":pctN(r.last.cbp,2),
          r.dcbp==null?"":(r.dcbp>0?"+":"")+r.dcbp.toFixed(2),
          String(r.last.w), r.last.tier];
      })};
  }
  if(which==="midmatrix"){
    const H=historyAt(MT.level); const {all}=mtRows();
    const dates = H.stamps.map(s=>{const n=niceStamp(s); return n?n.full:String(s);});
    return {label:"CB % matrix", cols:null, sepAfter:[],
      head:[MT.level==="bucket"?"Bucket":MT.level==="merch"?"Merchant":"MID",
            "Merchant","DBA","Bucket","Status"].concat(dates),
      rows:all.map(r=>[r.level==="mid"?r.id:r.key,r.m,r.d,r.b,r.status[0]].concat(
        r.pts.map(p=> !p ? "" : (p.cbp==null?"no sales":pctN(p.cbp,2)))))};
  }
  if(which==="trend"){
    const ser=portfolioSeries();
    return {label:"Portfolio trend", cols:null, sepAfter:[],
      head:["Report","MIDs","Act today","High","Monitor","Integrity","Flagged",
            "Ranked","Quarantine","CB total","Portfolio CB %","F1","F2","F3","F4","F5"],
      rows:ser.slice().reverse().map(x=>{
        const n=niceStamp(x.snap.stamp);
        const tot=x.A.E.reduce((a,e)=>a+e.s,0), cb=x.A.E.reduce((a,e)=>a+e.cb,0);
        return [n?n.full:x.snap.name, intN(x.A.total), intN(x.A.crit.length),
          intN(x.A.high.length), intN(x.A.mon.length), intN(x.A.integ.length),
          intN(x.A.ranked.length+x.A.quar.length), intN(x.A.ranked.length),
          intN(x.A.quar.length), intN(cb), tot>0?pctN(cb/tot*100,3):"",
          intN(x.A.flagCounts.F1), intN(x.A.flagCounts.F2), intN(x.A.flagCounts.F3),
          intN(x.A.flagCounts.F4), intN(x.A.flagCounts.F5)];
      })};
  }
  if(which==="detail"){
    if(!MT.sel) return {label:"Selected history", cols:null, head:["Note"],
                        rows:[["Nothing selected — click a row in Trends"]], sepAfter:[]};
    const H=historyAt(MT.sel.level);
    const rec=H.rows.find(r=>r.key===MT.sel.key);
    if(!rec) return {label:"Selected history", cols:null, head:["Note"],
                     rows:[["That row is not in the current library"]], sepAfter:[]};
    const isMid = rec.level==="mid";

        r.pts.forEach((p,i)=>{
          if(p && (!r.period || p.period===r.period)){ if(fi<0) fi=i; li=i; }
        });
        if(fi<0){ fi=r.pts.findIndex(Boolean); r.pts.forEach((p,i)=>{ if(p) li=i; }); }
        const nf=niceStamp(H.stamps[fi]), nl=niceStamp(H.stamps[li]);
        return [r.level==="mid"?r.id:r.key, r.m, r.d, r.b, periodLabel(r.period), String(r.n), r.status[0],
          nf?nf.full:String(H.stamps[fi]), nl?nl.full:String(H.stamps[li]),
          intN(r.first.s), intN(r.last.s), (r.dsal>0?"+":"")+intN(r.dsal),

          r.dcbp==null?"":(r.dcbp>0?"+":"")+r.dcbp.toFixed(2),

  return {label: pick?pick[0]:"Full audit", cols:EXPORT_COLS,
          head:EXPORT_COLS.map(c=>c.h), rows:list.map(exportRow), sepAfter};
}


/* Audit filenames are YEAR-MONTH-DAY-AUDIT, dated from the report's own
   timestamp rather than today's date — the name tells you when the data is
   from, not when you happened to click save. Year-first means a plain
   alphabetical folder listing is already in chronological order. */
function auditBaseName(){
  const st = SNAP_A && SNAP_A.stamp ? SNAP_A.stamp : null;
  if(st && /^\d{4}-\d{2}-\d{2}/.test(st)) return st.slice(0,10) + "-AUDIT";
  /* no timestamp in the source filename — fall back to today */
  const n=new Date(), p=v=>String(v).padStart(2,"0");
  return `${n.getFullYear()}-${p(n.getMonth()+1)}-${p(n.getDate())}-AUDIT`;
}
function auditFileName(){ return auditBaseName()+".csv"; }

/* ---- serialisers ---- */
/* Identifiers must never reach a spreadsheet as numbers. A MID like
   0700100000199484 is parsed as a float by Excel and Google Sheets, which
   drops the leading zero and makes the row impossible to join back to a
   portal export. ="…" is the one wrapper both of them read as text. */
function asText(set, i, v){
  const col = set.cols && set.cols[i];
  return (col && col.text && String(v)!=="") ? '="' + String(v).replace(/"/g,'') + '"' : v;
}
function toTSV(set){
  return [set.head.join("\t")]
    .concat(set.rows.map(r=>r.map((v,i)=>asText(set,i,v)).join("\t"))).join("\n");
}
function toCSV(set){
  const q=v=>/[",\n]/.test(String(v))?'"'+String(v).replace(/"/g,'""')+'"':String(v);
  return [set.head.map(q).join(",")]
    .concat(set.rows.map(r=>r.map((v,i)=>q(asText(set,i,v))).join(","))).join("\n");
}
/* Google Sheets honours pasted HTML, so the thick group rules and
   bold header survive the paste. Plain TSV rides along as fallback. */
function toHTML(set){
  const sep = new Set(set.sepAfter||[]);
  const THICK = "border-right:2px solid #000";
  const th = set.head.map((h,i)=>
    `<th style="background:#f0efec;border:1px solid #c3c2b7;${sep.has(i)?THICK:""};
      padding:4px 6px;font-weight:700;text-align:left">${esc(h)}</th>`).join("");
  const body = set.rows.map(r=>"<tr>"+r.map((v,i)=>{
    const numeric = set.cols ? !!(set.cols[i].int||set.cols[i].money||set.cols[i].pct) : false;
    const asTxt = set.cols && set.cols[i] && set.cols[i].text;
    return `<td style="border:1px solid #e1e0d9;${sep.has(i)?THICK:""};padding:3px 6px;
      ${asTxt?"mso-number-format:'\\@';":""}
      text-align:${numeric?"right":"left"}">${esc(v)}</td>`;
  }).join("")+"</tr>").join("");
  return `<table style="border-collapse:collapse;font-family:Arial,sans-serif;font-size:11pt">
    <thead><tr>${th}</tr></thead><tbody>${body}</tbody></table>`;
}

async function copySet(set){
  const tsv=toTSV(set), html=toHTML(set);
  try{
    if(window.ClipboardItem && navigator.clipboard && navigator.clipboard.write){
      await navigator.clipboard.write([ new ClipboardItem({
        "text/html": new Blob([html],{type:"text/html"}),
        "text/plain": new Blob([tsv],{type:"text/plain"})
      })]);
      return true;
    }
    await navigator.clipboard.writeText(tsv);
    return true;
  }catch(e){
    showErr("Could not reach the clipboard from this context. Use Download CSV instead.");
    return false;
  }
}
function downloadText(name, text){
  const blob=new Blob([text],{type:"text/csv;charset=utf-8"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob);
  a.download=name; a.click(); URL.revokeObjectURL(a.href);
}

async function copyTSV(which){
  const set=exportSet(which);
  const tsv=toTSV(set), html=toHTML(set);
  const done = () => toast(`${set.label} copied — ${set.rows.length} row${
    set.rows.length===1?"":"s"}. Paste into Google Sheets.`);
  try{
    if(window.ClipboardItem && navigator.clipboard && navigator.clipboard.write){
      await navigator.clipboard.write([ new ClipboardItem({
        "text/html": new Blob([html], {type:"text/html"}),
        "text/plain": new Blob([tsv], {type:"text/plain"})
      })]);
      done(); return;
    }
    await navigator.clipboard.writeText(tsv); done(); return;
  }catch(err){ /* fall through */ }
  try{
    const d=document.createElement("div");
    d.setAttribute("contenteditable","true");
    d.style.position="fixed"; d.style.opacity="0"; d.innerHTML=html;
    document.body.appendChild(d);
    const rg=document.createRange(); rg.selectNodeContents(d);
    const sel=window.getSelection(); sel.removeAllRanges(); sel.addRange(rg);
    document.execCommand("copy");
    sel.removeAllRanges(); d.remove(); done();
  }catch(e2){
    showErr("Could not reach the clipboard from this context. Use Download CSV instead.");
  }
}

  const set=exportSet("all");

  const a=document.createElement("a"); a.href=URL.createObjectURL(blob);

function ingestFiles(files){
  const list=[...files].filter(f=>/\.csv$/i.test(f.name)||f.type==="text/csv");
  if(!list.length){ showErr("Those files are not CSV exports."); return; }
  let done=0, added=0, replaced=0, failed=[], newIds=[];
  list.forEach(file=>{
    const rd=new FileReader();
    rd.onload=()=>{
      try{
        const snap=loadSnapshot(String(rd.result), file.name);
        const r=addSnapshot(snap);
        newIds.push(r.id);
        if(r.replaced) replaced++; else added++;
      }catch(err){
        failed.push(file.name+": "+(err.isAudit
          ? "that is an audit this tool produced, not a portal export"
          : (err.message||err)));
      }
      if(++done===list.length) finish();
    };
    rd.onerror=()=>{ failed.push(file.name+": could not be read");
      if(++done===list.length) finish(); };
    rd.readAsText(file);
  });
  function finish(){
    focusNewest(newIds);
    renderDataStrip(); syncActive();
    render();
    if(failed.length) showErr("Skipped "+failed.length+": "+failed.join(" · "));
    else clearErr();
    if(folderMode() && added) toast(added+" loose file"+(added===1?"":"s")
      +" added for this session — save them into "+FOLDER.name+" to keep them.");
    const bits=[];
    if(added) bits.push(added+" report"+(added===1?"":"s")+" added");
    if(replaced) bits.push(replaced+" refreshed");
    if(bits.length) toast(bits.join(", ")+".");
  }
}

/* whole-page drop target with overlay */
(function(){
  const dz=$("#dz"); let depth=0;
  const hasFiles=e=>e.dataTransfer && [...(e.dataTransfer.types||[])].includes("Files");
  window.addEventListener("dragenter",e=>{
    if(!hasFiles(e)) return; e.preventDefault(); depth++; dz.classList.add("on"); });
  window.addEventListener("dragover",e=>{ if(hasFiles(e)) e.preventDefault(); });
  window.addEventListener("dragleave",e=>{
    if(!hasFiles(e)) return; depth=Math.max(0,depth-1); if(!depth) dz.classList.remove("on"); });
  window.addEventListener("drop",e=>{
    if(!hasFiles(e)) return;
    e.preventDefault(); depth=0; dz.classList.remove("on");
    ingestFiles(e.dataTransfer.files);
  });
})();

window.__store = () => ({ok:STORE.ok});
window.__fs = () => ({supported:FS_OK, state:FOLDER.state, name:FOLDER.name,
  found:FOLDER.found, skipped:FOLDER.skipped, auditDir:FOLDER.AUDIT_DIR});
window.__strip = () => {
  const el=document.getElementById("datastrip");
  return {title: el.querySelector(".dtitle")?.textContent.replace(/\s+/g," ").trim(),
          sub: el.querySelector(".dsub")?.textContent.replace(/\s+/g," ").trim(),
          buttons: [...el.querySelectorAll(".dacts button")].map(b=>b.textContent.trim()),
          tabs: [...el.querySelectorAll(".tab .dt")].map(b=>b.textContent.trim()),
          hasTabX: !!el.querySelector(".tab .x")};
};
window.__mockFolder = (files) => {
  /* files: [{name, text}] — exercises the same scan path as a real handle */
  FOLDER.handle = {
    name:"MockReports",
    async *values(){
      for(const f of files){
        yield {kind:"file", name:f.name,
          async getFile(){ return {text:async()=>f.text, lastModified:Date.now()}; }};
      }
    },
    async queryPermission(){ return "granted"; },
    async requestPermission(){ return "granted"; },
    __files:{},
    __dirs:{},
    async getDirectoryHandle(n,opts){
      const self=this;
      if(!self.__dirs[n]){
        if(!opts||!opts.create){ const e=new Error("no dir"); e.name="NotFoundError"; throw e; }
        self.__dirs[n]={name:n, __files:{},
          async getFileHandle(fn,o){
            const d=this;
            if((!o||!o.create) && !d.__files[fn]){
              const e=new Error("not found"); e.name="NotFoundError"; throw e;
            }
            return {async createWritable(){ return {
              async write(bl){ d.__files[fn]=bl.size;
                FOLDER.__written={dir:n, name:fn, size:bl.size}; },
              async close(){}
            };}};
          }};
      }
      return self.__dirs[n];
    },
    async getFileHandle(n,opts){
      const self=this;
      if((!opts||!opts.create) && !self.__files[n]){
        const e=new Error("not found"); e.name="NotFoundError"; throw e;
      }
      return {async createWritable(){ return {
        async write(b){ self.__files[n]=b.size; FOLDER.__written={name:n,size:b.size}; },
        async close(){}
      };}};
    }
  };
  FOLDER.name="MockReports"; FOLDER.state="connected";
  return loadFromFolder();
};
window.__written = () => FOLDER.__written || null;
window.__auditName = () => auditFileName();
window.__saveToFolder = () => saveCurrentToFolder();
window.__midTrend = () => {
  const {all,stamps}=mtRows();
  return {reports:stamps.length, rows:all.length,
    sample:all.slice(0,8).map(r=>({id:r.id,d:r.d,n:r.n,
      s:[r.first.s,r.last.s], cb:[r.first.cb,r.last.cb],
      cbp:[r.first.cbp,r.last.cbp], dcbp:r.dcbp, status:r.status[0]}))};
};
window.__setMT = o => { Object.assign(MT,o); render(); };
window.__setView = v => { VIEW.page=v; render(); };
window.__modelState = () => JSON.parse(JSON.stringify(MODEL));
window.__setBuckets = names => {
  VIEW.buckets = names ? new Set(names) : null; render();
  return VIEW.buckets ? [...VIEW.buckets] : null;
};
window.__bucketState = () => ({
  selected: VIEW.buckets ? [...VIEW.buckets].sort() : null,
  label: bucketLabel(),
  listed: bucketStats().length
});
window.__view = () => ({page:VIEW.page, level:MT.level, sel:MT.sel});
window.__levelRows = lvl => {
  const H=historyAt(lvl);
  return H.rows.map(r=>({key:r.key, n:r.n, nmids:r.last.nmids, over:[r.first.over,r.last.over],
    s:[r.first.s,r.last.s], cb:[r.first.cb,r.last.cb],
    cbp:[r.first.cbp,r.last.cbp], status:r.status[0]}));
};
window.__statusCounts = () => {
  const c={}; historyAt(MT.level).rows.forEach(r=>c[r.status[0]]=(c[r.status[0]]||0)+1); return c; };
window.__trend = () => portfolioSeries().map(x=>({
  stamp:x.snap.stamp, crit:x.A.crit.length, high:x.A.high.length,
  integ:x.A.integ.length, cb:x.A.E.reduce((a,e)=>a+e.cb,0)}));
window.__MODEL=MODEL;
window.__VERSION=()=>({app:APP_VERSION, model:MODEL_VERSION, latest:UPDATE.latest});
window.__UPDATE=UPDATE;
window.__exportSet=exportSet;
window.__toTSV=toTSV;

window.__THEME=THEME;
window.__themeCSS=themeCSS;
window.__applyTheme=applyTheme;
window.__contrast=contrast;

</script>
